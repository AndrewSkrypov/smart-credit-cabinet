# Every push and pull request: backend build with tests against a real PostgreSQL, frontend
# checks, then the images are built and scanned. A critical vulnerability with a fix available
# fails the pipeline.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_USER: cabinet
          POSTGRES_PASSWORD: cabinet
          POSTGRES_DB: cabinet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cabinet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Create the databases of the services
        env:
          PGPASSWORD: cabinet
        run: |
          for db in identity credit engagement; do
            psql -h localhost -U cabinet -d cabinet -c "create database $db"
          done
      - name: Build, ktlint and tests
        run: ./gradlew build --no-daemon
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: "**/build/reports/tests/"

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npx vitest run
      - run: npm run build

  images:
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [identity, credit, engagement, external-sim, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: |
          if [ "${{ matrix.service }}" = frontend ]; then
            docker build -f frontend/Dockerfile -t cabinet/frontend:ci .
          else
            docker build -f docker/service/Dockerfile --build-arg SERVICE=${{ matrix.service }} -t cabinet/${{ matrix.service }}:ci .
          fi
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cabinet/${{ matrix.service }}:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
