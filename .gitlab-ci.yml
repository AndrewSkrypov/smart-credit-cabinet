workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "ops/pump-worker-qualify-10" && $CI_COMMIT_REF_PROTECTED == "true"'
    - when: never

stages: [test]

variables:
  GIT_STRATEGY: clone
  GIT_DEPTH: "2"
  GIT_SUBMODULE_STRATEGY: none
  GIT_LFS_SKIP_SMUDGE: "1"

worker-qualification:
  stage: test
  tags: [cabinet-ci-qualify-10]
  timeout: 7 minutes
  script:
    - |
      set -eu
      test "$CI_RUNNER_ID" = "10"
      test "$(id -un)" = pump-ci
      test "$(git rev-parse HEAD)" = "$CI_COMMIT_SHA"
      git config --get remote.origin.url | grep -Eq '^https://([^/@]+@)?gitlab\.credit-cabinet\.ru/'
      test "$(git config --get http.sslVerify || true)" != false
      test ! -r /etc/gitlab-runner-pump-ci/config.toml
      test ! -w /run/docker.sock
      for variable in CABINET_DEV_SSH_KEY CABINET_PROD_VALUES KUBECONFIG VAULT_ID_TOKEN GIT_SSL_NO_VERIFY; do
        if printenv "$variable" >/dev/null; then exit 19; fi
      done
      test "$(node --version)" = v20.20.2
      test "$(helm version --template '{{.Version}}')" = v3.19.0
      test "$(docker version --format '{{.Server.Version}}')" = 29.8.2
      docker info --format '{{json .Labels}} {{json .SecurityOptions}} {{.CgroupDriver}} {{.CgroupVersion}}' |
        awk '/"cabinet-ci=true"/ && /name=rootless/ && /systemd 2$/ {ok=1} END {exit !ok}'
      "$JAVA_HOME/bin/javac" -version 2>&1 | grep -F '21.0.13.1'
      psql --version | grep -F '16.15'
      chmod +x gradlew
      ./gradlew --version | grep -Fx 'Gradle 8.10.2'
      curl --proto '=https' --fail --silent --show-error -o /dev/null https://gitlab.credit-cabinet.ru/users/sign_in
      printf '%s\n' 'PUMP quality worker verified'
