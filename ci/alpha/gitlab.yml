# Pilot checks run on Alpha MRs and on explicitly selected Dev pipelines.
.alpha-pilot-verify:
  extends: .quality
  stage: verify
  rules:
    - if: '$CABINET_ALPHA_PILOT == "1"'
    - if: >-
        $CI_PIPELINE_SOURCE == "merge_request_event" &&
        ($CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == "feature/alpha-analytics-pilot" ||
        $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == "feature/alpha-dev-provisioning" ||
        $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == "feature/alpha-kafka-security" ||
        $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME == "codex/alpha-dev-valkey") &&
        $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "feat/final-platform-release"

alpha-pilot-infrastructure:
  extends: .alpha-pilot-verify
  timeout: 20 minutes
  variables:
    ALPHA_PILOT_SCAN_KAFKA: "1"
  script:
    - python3 ci/alpha/test_dev_rollout.py
    - mkdir -p ci-artifacts
    - bash ci/alpha/smoke.sh > ci-artifacts/alpha-infrastructure.tsv
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - ci-artifacts/alpha-infrastructure.tsv
      - security/reports/alpha-kafka/summary.json
      - security/reports/alpha-kafka/trivy-image-0.json

alpha-pilot-analytics-jar:
  extends: .alpha-pilot-verify
  timeout: 30 minutes
  dependencies: []
  script:
    - bash ci/alpha/build-analytics.sh
    - python3 ci/alpha/projection-smoke.py > ci-artifacts/alpha-projection.tsv
  artifacts:
    expire_in: 14 days
    paths:
      - ci-artifacts/alpha-analytics/
      - ci-artifacts/alpha-projection.tsv
