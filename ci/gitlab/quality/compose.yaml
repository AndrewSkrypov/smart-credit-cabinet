services:
  gateway:
    ports: !override
      - "127.0.0.1:${GATEWAY_PORT:?}:80"
  clamav:
    image: "${CABINET_CI_CLAMAV_IMAGE:-clamav/clamav:1.5.5@sha256:64e30c0bf976198024deb3dc6d5cfe2485fb969c0f73549ba0fdb364b9469614}"
    environment:
      ANTIVIRUS_MAX_SIGNATURE_AGE: P7D
  credit:
    environment:
      ANTIVIRUS_MAX_SIGNATURE_AGE: P7D
