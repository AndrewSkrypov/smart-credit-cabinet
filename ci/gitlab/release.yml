.release:
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE != "merge_request_event" && $CI_PIPELINE_SOURCE != "schedule"'
      when: manual
      allow_failure: false

release-images:
  extends: .release
  stage: release
  tags: [cabinet-release]
  dependencies: [backend, frontend]
  script:
    - bash ci/gitlab/publish-images.sh
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - release.json
      - security/reports/

dev-deploy:
  extends: [.release, .pump-vault-job-identity]
  stage: dev
  tags: [cabinet-deploy]
  resource_group: cabinet-dev
  environment:
    name: dev
    action: start
    url: $CABINET_DEV_URL
  dependencies: [release-images]
  script:
    - |
      case "${PUMP_VAULT_DEV_ENABLED:-0}" in
        0) unset PUMP_VAULT_ID_TOKEN; bash ci/gitlab/deploy-dev.sh ;;
        1) python3 ci/gitlab/vault/with-deploy-secrets.py dev -- bash ci/gitlab/deploy-dev.sh ;;
        *) echo "Invalid Dev Vault mode" >&2; exit 1 ;;
      esac
    - sha256sum release.json > dev-release.sha256
  artifacts:
    expire_in: 30 days
    paths: [dev-release.sha256]

dev-vault-canary:
  extends: .pump-vault-job-identity
  stage: dev
  tags: [cabinet-deploy]
  resource_group: cabinet-dev
  timeout: 5m
  environment:
    name: dev
    action: verify
  needs: []
  rules:
    - if: '$CI_COMMIT_BRANCH == "feat/final-platform-release" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE =~ /^(push|api|web)$/'
      when: manual
      allow_failure: true
  script:
    - python3 ci/gitlab/vault/with-deploy-secrets.py dev-canary

prod-deploy:
  extends: .release
  stage: prod
  tags: [cabinet-deploy-prod]
  resource_group: cabinet-prod
  environment:
    name: production
    url: $CABINET_PROD_URL
  dependencies: [release-images, dev-deploy]
  script:
    - sha256sum -c dev-release.sha256
    - bash ci/gitlab/deploy-prod.sh

dev-diagnostics:
  stage: dev
  tags: [cabinet-deploy]
  resource_group: cabinet-dev
  environment:
    name: dev
    action: verify
  needs:
    - job: dev-diagnostics-docker
      artifacts: false
  variables:
    GIT_DEPTH: "2"
  timeout: 5 minutes
  rules:
    - if: '$CABINET_DEV_DIAGNOSTICS == "1" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE != "merge_request_event" && $CI_PIPELINE_SOURCE != "schedule"'
      when: manual
      allow_failure: false
  script:
    - bash ci/gitlab/diagnose-dev.sh
  artifacts:
    expire_in: 14 days
    paths: [dev-diagnostics.json]
