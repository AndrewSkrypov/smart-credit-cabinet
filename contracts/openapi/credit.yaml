components:
  schemas:
    ActionResult:
      properties:
        applicationId:
          format: uuid
          type: string
        status:
          enum:
          - DRAFT
          - SUBMITTED
          - INFO_REQUESTED
          - ENRICHMENT
          - SCORING
          - MANUAL_REVIEW
          - OFFER_ISSUED
          - SIGNING
          - DISBURSING
          - DISBURSED
          - REJECTED
          - WITHDRAWN
          - CLOSED
          type: string
      required:
      - applicationId
      - status
      type: object
    Analytics:
      properties:
        automaticOutcomes:
          items:
            $ref: '#/components/schemas/OutcomeCount'
          type: array
        currentStatuses:
          additionalProperties:
            format: int32
            type: integer
          type: object
        disbursedAmount:
          format: int64
          type: integer
        from:
          format: date-time
          type: string
        funnel:
          items:
            $ref: '#/components/schemas/FunnelStep'
          type: array
        manualOutcomes:
          items:
            $ref: '#/components/schemas/OutcomeCount'
          type: array
        manualOverrides:
          format: int32
          type: integer
        stageTimes:
          items:
            $ref: '#/components/schemas/StageTime'
          type: array
        to:
          format: date-time
          type: string
      required:
      - automaticOutcomes
      - currentStatuses
      - disbursedAmount
      - from
      - funnel
      - manualOutcomes
      - manualOverrides
      - stageTimes
      - to
      type: object
    ApplicationRequest:
      properties:
        amount:
          format: int64
          type: integer
        bureauConsent:
          type: boolean
        declaredMonthlyDebtPayments:
          format: int64
          type: integer
        declaredRevenue12m:
          format: int64
          type: integer
        productCode:
          minLength: 1
          type: string
        purpose:
          enum:
          - CASH_GAP
          - CURRENT_EXPENSES
          - WORKING_CAPITAL
          - EQUIPMENT
          - VEHICLE
          - RENOVATION
          - BUSINESS_DEVELOPMENT
          type: string
        purposeComment:
          maxLength: 1000
          minLength: 0
          type: string
        termMonths:
          format: int32
          maximum: 120
          minimum: 1
          type: integer
      required:
      - amount
      - bureauConsent
      - productCode
      - purpose
      - termMonths
      type: object
    ApplicationResponse:
      properties:
        allowedActions:
          items:
            enum:
            - SUBMIT
            - DATA_COMPLETE
            - DATA_INCOMPLETE
            - INFO_PROVIDED
            - INFO_EXPIRED
            - SOURCE_FAILED
            - ENRICHMENT_DONE
            - SOURCE_TIMED_OUT
            - AUTO_OFFER
            - TO_MANUAL_REVIEW
            - AUTO_REJECT
            - APPROVE
            - COUNTER_OFFER
            - REQUEST_INFO
            - REJECT
            - ACCEPT_OFFER
            - DECLINE_OFFER
            - OFFER_EXPIRED
            - SIGN
            - DISBURSEMENT_FAILED
            - DISBURSED
            - WITHDRAW
            type: string
          type: array
        amount:
          format: int64
          type: integer
        bureauConsent:
          type: boolean
        canUploadDocuments:
          type: boolean
        closeReason:
          enum:
          - INFO_EXPIRED
          - OFFER_DECLINED
          - OFFER_EXPIRED
          type: string
        company:
          $ref: '#/components/schemas/CompanyView'
        createdAt:
          format: date-time
          type: string
        currentProduct:
          $ref: '#/components/schemas/Product'
        declaredMonthlyDebtPayments:
          format: int64
          type: integer
        declaredRevenue12m:
          format: int64
          type: integer
        documents:
          items:
            $ref: '#/components/schemas/DocumentView'
          type: array
        editable:
          type: boolean
        estimate:
          $ref: '#/components/schemas/EstimateView'
        id:
          format: uuid
          type: string
        number:
          format: int64
          type: integer
        process:
          $ref: '#/components/schemas/ProcessView'
        product:
          $ref: '#/components/schemas/ProductView'
        purpose:
          enum:
          - CASH_GAP
          - CURRENT_EXPENSES
          - WORKING_CAPITAL
          - EQUIPMENT
          - VEHICLE
          - RENOVATION
          - BUSINESS_DEVELOPMENT
          type: string
        purposeComment:
          type: string
        purposeTitle:
          type: string
        requiredDocuments:
          items:
            $ref: '#/components/schemas/RequiredDocumentView'
          type: array
        status:
          enum:
          - DRAFT
          - SUBMITTED
          - INFO_REQUESTED
          - ENRICHMENT
          - SCORING
          - MANUAL_REVIEW
          - OFFER_ISSUED
          - SIGNING
          - DISBURSING
          - DISBURSED
          - REJECTED
          - WITHDRAWN
          - CLOSED
          type: string
        statusChangedAt:
          format: date-time
          type: string
        submissionProblems:
          items:
            type: string
          type: array
        submittedAt:
          format: date-time
          type: string
        termMonths:
          format: int32
          type: integer
        version:
          format: int64
          type: integer
      required:
      - allowedActions
      - amount
      - bureauConsent
      - canUploadDocuments
      - company
      - createdAt
      - documents
      - editable
      - id
      - process
      - product
      - purpose
      - purposeTitle
      - requiredDocuments
      - status
      - statusChangedAt
      - submissionProblems
      - termMonths
      type: object
    ApplicationSummary:
      properties:
        amount:
          format: int64
          type: integer
        companyInn:
          type: string
        companyName:
          type: string
        createdAt:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        number:
          format: int64
          type: integer
        productCode:
          type: string
        productName:
          type: string
        status:
          enum:
          - DRAFT
          - SUBMITTED
          - INFO_REQUESTED
          - ENRICHMENT
          - SCORING
          - MANUAL_REVIEW
          - OFFER_ISSUED
          - SIGNING
          - DISBURSING
          - DISBURSED
          - REJECTED
          - WITHDRAWN
          - CLOSED
          type: string
        statusChangedAt:
          format: date-time
          type: string
        submittedAt:
          format: date-time
          type: string
        termMonths:
          format: int32
          type: integer
        unreadChatCount:
          format: int64
          type: integer
      required:
      - amount
      - companyInn
      - createdAt
      - id
      - productCode
      - productName
      - status
      - statusChangedAt
      - termMonths
      - unreadChatCount
      type: object
    ArtifactView:
      properties:
        checksum:
          type: string
        contentType:
          type: string
        createdAt:
          format: date-time
          type: string
        downloadUrl:
          type: string
        errorMessage:
          type: string
        fileName:
          type: string
        id:
          format: uuid
          type: string
        kind:
          enum:
          - CONTRACT_PDF
          - SCHEDULE_PDF
          - SCHEDULE_XLSX
          type: string
        phase:
          enum:
          - PREVIEW
          - FINAL
          type: string
        readyAt:
          format: date-time
          type: string
        sizeBytes:
          format: int64
          type: integer
        status:
          enum:
          - PENDING
          - READY
          - ERROR
          type: string
        title:
          type: string
      required:
      - contentType
      - createdAt
      - fileName
      - id
      - kind
      - phase
      - status
      - title
      type: object
    AssessmentView:
      properties:
        actions:
          items:
            type: string
          type: array
        applicationId:
          format: uuid
          type: string
        automaticDecision:
          $ref: '#/components/schemas/DecisionView'
        bank:
          $ref: '#/components/schemas/BankInfo'
        bureau:
          $ref: '#/components/schemas/BureauInfo'
        discrepancies:
          items:
            $ref: '#/components/schemas/Discrepancy'
          type: array
        latestDecision:
          $ref: '#/components/schemas/DecisionView'
        registry:
          $ref: '#/components/schemas/RegistryInfo'
        sourceFetchedAt:
          additionalProperties:
            format: date-time
            type: string
          type: object
        status:
          enum:
          - DRAFT
          - SUBMITTED
          - INFO_REQUESTED
          - ENRICHMENT
          - SCORING
          - MANUAL_REVIEW
          - OFFER_ISSUED
          - SIGNING
          - DISBURSING
          - DISBURSED
          - REJECTED
          - WITHDRAWN
          - CLOSED
          type: string
        tax:
          $ref: '#/components/schemas/TaxInfo'
        turnoverVariation:
          format: double
          type: number
      required:
      - actions
      - applicationId
      - discrepancies
      - sourceFetchedAt
      - status
      type: object
    BankInfo:
      properties:
        client:
          type: boolean
        monthlyInflows:
          items:
            format: int64
            type: integer
          type: array
        settlementAccount:
          type: string
      required:
      - client
      - monthlyInflows
      type: object
    BureauInfo:
      properties:
        currentOverdueDaysMax:
          format: int32
          type: integer
        inquiries30d:
          format: int32
          type: integer
        monthlyPaymentsTotal:
          format: int64
          type: integer
        obligations:
          items:
            $ref: '#/components/schemas/BureauObligation'
          type: array
        worstOverdueDays24m:
          format: int32
          type: integer
      required:
      - currentOverdueDaysMax
      - inquiries30d
      - monthlyPaymentsTotal
      - obligations
      - worstOverdueDays24m
      type: object
    BureauObligation:
      properties:
        balance:
          format: int64
          type: integer
        creditor:
          type: string
        currentOverdueDays:
          format: int32
          type: integer
        limit:
          format: int64
          type: integer
        monthlyPayment:
          format: int64
          type: integer
        type:
          type: string
      required:
      - balance
      - creditor
      - currentOverdueDays
      - limit
      - monthlyPayment
      - type
      type: object
    Calculation:
      properties:
        monthlyPayment:
          type: number
        overpayment:
          type: number
        rate:
          type: number
        revolving:
          type: boolean
        schedule:
          items:
            $ref: '#/components/schemas/ScheduleRow'
          type: array
        totalPayment:
          type: number
      required:
      - monthlyPayment
      - overpayment
      - rate
      - revolving
      - schedule
      - totalPayment
      type: object
    ChatAudit:
      properties:
        action:
          enum:
          - MESSAGE_SENT
          - ATTACHMENT_UPLOADED
          - READ_CURSOR_ADVANCED
          type: string
        actorId:
          format: uuid
          type: string
        actorRole:
          type: string
        applicationId:
          format: uuid
          type: string
        documentId:
          format: uuid
          type: string
        id:
          format: uuid
          type: string
        messageId:
          format: uuid
          type: string
        occurredAt:
          format: date-time
          type: string
        readSeq:
          format: int64
          type: integer
      required:
      - action
      - actorId
      - actorRole
      - applicationId
      - id
      - occurredAt
      type: object
    ChatFile:
      properties:
        fileName:
          type: string
        id:
          format: uuid
          type: string
        sizeBytes:
          format: int64
          type: integer
      required:
      - fileName
      - id
      - sizeBytes
      type: object
    ChatState:
      properties:
        lastSeq:
          format: int64
          type: integer
        readSeq:
          format: int64
          type: integer
        unreadCount:
          format: int64
          type: integer
      required:
      - lastSeq
      - readSeq
      - unreadCount
      type: object
    ChatView:
      properties:
        hasNewer:
          type: boolean
        hasOlder:
          type: boolean
        lastSeq:
          format: int64
          type: integer
        messages:
          items:
            $ref: '#/components/schemas/MessageView'
          type: array
        readOnlyReason:
          type: string
        readSeq:
          format: int64
          type: integer
        side:
          enum:
          - COMPANY
          - BANK
          type: string
        unreadCount:
          format: int64
          type: integer
        writable:
          type: boolean
      required:
      - hasNewer
      - hasOlder
      - lastSeq
      - messages
      - readSeq
      - side
      - unreadCount
      - writable
      type: object
    CommentRequest:
      properties:
        comment:
          maxLength: 2000
          minLength: 0
          type: string
      type: object
    CompanyView:
      properties:
        id:
          format: uuid
          type: string
        inn:
          type: string
        legalForm:
          enum:
          - LEGAL_ENTITY
          - ENTREPRENEUR
          type: string
        name:
          type: string
      required:
      - id
      - inn
      - legalForm
      type: object
    ContractTextSnapshot:
      properties:
        applicationId:
          format: uuid
          type: string
        createdAt:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        offerId:
          format: uuid
          type: string
        sha256:
          type: string
        templateVersion:
          format: int32
          type: integer
        text:
          type: string
      required:
      - applicationId
      - createdAt
      - id
      - offerId
      - sha256
      - templateVersion
      - text
      type: object
    ContractTextView:
      properties:
        legacySummary:
          type: boolean
        signable:
          type: boolean
        signedAt:
          format: date-time
          type: string
        snapshot:
          $ref: '#/components/schemas/ContractTextSnapshot'
        text:
          type: string
      required:
      - legacySummary
      - signable
      - text
      type: object
    CounterOfferRequest:
      properties:
        amount:
          format: int64
          type: integer
        comment:
          maxLength: 2000
          minLength: 0
          type: string
        productCode:
          type: string
        termMonths:
          format: int32
          maximum: 120
          minimum: 1
          type: integer
      required:
      - amount
      - termMonths
      type: object
    DecisionView:
      properties:
        comment:
          type: string
        createdAt:
          format: date-time
          type: string
        decidedBy:
          format: uuid
          type: string
        decidedByType:
          type: string
        factors:
          items:
            $ref: '#/components/schemas/FactorScore'
          type: array
        id:
          format: uuid
          type: string
        manualReasons:
          items:
            $ref: '#/components/schemas/ReasonView'
          type: array
        outcome:
          enum:
          - APPROVE
          - COUNTER_OFFER
          - MANUAL_REVIEW
          - REJECT
          - REQUEST_INFO
          type: string
        rating:
          enum:
          - A
          - B
          - C
          - D
          - E
          type: string
        reasonCode:
          type: string
        recommendation:
          $ref: '#/components/schemas/Recommendation'
        ruleSetVersion:
          format: int32
          type: integer
        score:
          format: int32
          type: integer
        stopFactors:
          items:
            $ref: '#/components/schemas/ReasonView'
          type: array
      required:
      - createdAt
      - decidedByType
      - factors
      - id
      - manualReasons
      - outcome
      - ruleSetVersion
      - stopFactors
      type: object
    DeclineRequest:
      properties:
        comment:
          maxLength: 2000
          minLength: 0
          type: string
      type: object
    Discrepancy:
      properties:
        actual:
          type: string
        declared:
          type: string
        differencePercent:
          format: int32
          type: integer
        field:
          type: string
        source:
          type: string
      required:
      - actual
      - declared
      - field
      - source
      type: object
    DocumentView:
      properties:
        fileName:
          type: string
        id:
          format: uuid
          type: string
        sizeBytes:
          format: int64
          type: integer
        title:
          type: string
        type:
          enum:
          - TAX_RETURN
          - FINANCIAL_STATEMENTS
          - EQUIPMENT_INVOICE
          - BANK_STATEMENT
          - OTHER
          type: string
        uploadedAt:
          format: date-time
          type: string
      required:
      - fileName
      - id
      - sizeBytes
      - title
      - type
      - uploadedAt
      type: object
    ErrorResponse:
      description: Ошибка API
      properties:
        error:
          description: Название HTTP-статуса
          example: Not Found
          type: string
        message:
          description: Понятное объяснение ошибки
          example: Заявка не найдена
          type: string
        path:
          description: Путь запроса, который завершился ошибкой
          example: /api/v1/applications/00000000-0000-0000-0000-000000000001
          type: string
        requestId:
          type: string
        status:
          description: HTTP-код ошибки
          example: 404
          format: int32
          type: integer
        timestamp:
          format: date-time
          type: string
    EstimateView:
      properties:
        monthlyPayment:
          type: number
        rate:
          type: number
      required:
      - monthlyPayment
      - rate
      type: object
    FactorScore:
      properties:
        factor:
          enum:
          - AGE
          - TURNOVER_STABILITY
          - DEBT_LOAD
          - PAYMENT_DISCIPLINE
          - CREDIT_ACTIVITY
          - TAX_DISCIPLINE
          - INDUSTRY_RISK
          - REQUEST_SIZE
          type: string
        hint:
          type: string
        maxPoints:
          format: int32
          type: integer
        points:
          format: int32
          type: integer
        title:
          type: string
        value:
          type: string
      required:
      - factor
      - maxPoints
      - points
      - title
      - value
      type: object
    FunnelStep:
      properties:
        applications:
          format: int32
          type: integer
        code:
          type: string
        title:
          type: string
      required:
      - applications
      - code
      - title
      type: object
    InfoItemView:
      properties:
        documentType:
          enum:
          - TAX_RETURN
          - FINANCIAL_STATEMENTS
          - EQUIPMENT_INVOICE
          - BANK_STATEMENT
          - OTHER
          type: string
        question:
          type: string
        reason:
          type: string
        title:
          type: string
      required:
      - title
      type: object
    InfoRequestBody:
      properties:
        comment:
          maxLength: 2000
          minLength: 0
          type: string
        items:
          items:
            $ref: '#/components/schemas/RequestedItem'
          maxItems: 10
          minItems: 1
          type: array
      required:
      - items
      type: object
    InfoRequestView:
      properties:
        comment:
          type: string
        deadline:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        items:
          items:
            $ref: '#/components/schemas/InfoItemView'
          type: array
        requestedAt:
          format: date-time
          type: string
      required:
      - deadline
      - id
      - items
      - requestedAt
      type: object
    JournalEntryView:
      properties:
        actorId:
          format: uuid
          type: string
        actorType:
          enum:
          - CLIENT
          - SYSTEM
          - MANAGER
          - UNDERWRITER
          type: string
        comment:
          type: string
        event:
          type: string
        fromStatus:
          enum:
          - DRAFT
          - SUBMITTED
          - INFO_REQUESTED
          - ENRICHMENT
          - SCORING
          - MANUAL_REVIEW
          - OFFER_ISSUED
          - SIGNING
          - DISBURSING
          - DISBURSED
          - REJECTED
          - WITHDRAWN
          - CLOSED
          type: string
        id:
          format: uuid
          type: string
        occurredAt:
          format: date-time
          type: string
        payload:
          additionalProperties: {}
          type: object
        reasonCode:
          type: string
        toStatus:
          enum:
          - DRAFT
          - SUBMITTED
          - INFO_REQUESTED
          - ENRICHMENT
          - SCORING
          - MANUAL_REVIEW
          - OFFER_ISSUED
          - SIGNING
          - DISBURSING
          - DISBURSED
          - REJECTED
          - WITHDRAWN
          - CLOSED
          type: string
      required:
      - actorType
      - event
      - id
      - occurredAt
      - payload
      - toStatus
      type: object
    LoanView:
      properties:
        amount:
          format: int64
          type: integer
        contractNumber:
          type: string
        disbursedAt:
          format: date-time
          type: string
        loanAccount:
          type: string
        maturityDate:
          format: date
          type: string
        rate:
          type: number
        settlementAccount:
          type: string
        termMonths:
          format: int32
          type: integer
      required:
      - amount
      - contractNumber
      - disbursedAt
      - loanAccount
      - maturityDate
      - rate
      - settlementAccount
      - termMonths
      type: object
    MatchRequest:
      properties:
        amount:
          format: int64
          type: integer
        purpose:
          enum:
          - CASH_GAP
          - CURRENT_EXPENSES
          - WORKING_CAPITAL
          - EQUIPMENT
          - VEHICLE
          - RENOVATION
          - BUSINESS_DEVELOPMENT
          type: string
        termMonths:
          format: int32
          maximum: 120
          minimum: 1
          type: integer
      required:
      - amount
      - purpose
      - termMonths
      type: object
    MatchResponse:
      properties:
        adjustments:
          items:
            type: string
          type: array
        fits:
          type: boolean
        monthlyPayment:
          type: number
        overpayment:
          type: number
        product:
          $ref: '#/components/schemas/Product'
        reasons:
          items:
            type: string
          type: array
        termMonths:
          format: int32
          type: integer
      required:
      - adjustments
      - fits
      - product
      - reasons
      - termMonths
      type: object
    MessageRequest:
      properties:
        documentIds:
          items:
            format: uuid
            type: string
          type: array
        text:
          type: string
      required:
      - documentIds
      - text
      type: object
    MessageView:
      properties:
        attachments:
          items:
            $ref: '#/components/schemas/ChatFile'
          type: array
        authorName:
          type: string
        createdAt:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        seq:
          format: int64
          type: integer
        side:
          enum:
          - COMPANY
          - BANK
          type: string
        text:
          type: string
      required:
      - attachments
      - authorName
      - createdAt
      - id
      - seq
      - side
      - text
      type: object
    NewRulesRequest:
      properties:
        comment:
          maxLength: 1000
          minLength: 0
          type: string
        expectedVersion:
          format: int32
          minimum: 1
          type: integer
        params:
          $ref: '#/components/schemas/RuleParams'
      required:
      - comment
      - expectedVersion
      - params
      type: object
    OfferTerms:
      properties:
        amount:
          format: int64
          type: integer
        monthlyPayment:
          type: number
        productCode:
          type: string
        rate:
          type: number
        termMonths:
          format: int32
          type: integer
        totalPayment:
          type: number
      required:
      - amount
      - monthlyPayment
      - productCode
      - rate
      - termMonths
      - totalPayment
      type: object
    OfferView:
      properties:
        amount:
          format: int64
          type: integer
        changes:
          items:
            type: string
          type: array
        id:
          format: uuid
          type: string
        kind:
          enum:
          - APPROVED
          - COUNTER
          type: string
        monthlyPayment:
          type: number
        productCode:
          type: string
        productName:
