info:
  description: REST API умного кредитного кабинета предпринимателя. Данные демо-стенда синтетические.
  title: 'Кабинет предпринимателя: заявки, кредитный конвейер и решения'
  version: 0.1.0
openapi: 3.1.0
paths:
  /api/v1/analytics/funnel:
    get:
      operationId: funnel
      parameters:
      - in: query
        name: from
        required: false
        schema:
          format: date-time
          type: string
      - in: query
        name: to
        required: false
        schema:
          format: date-time
          type: string
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Analytics'
          description: OK
        '401':
          content:
            application/json:
              example:
                error: Unauthorized
                message: Требуется вход в систему
                path: /api/v1/analytics/funnel
                requestId: example-request-id
                status: 401
                timestamp: '2026-01-01T00:00:00Z'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Нет корректного токена
        '403':
          content:
            application/json:
              example:
                error: Forbidden
                message: Недостаточно прав для этого действия
                path: /api/v1/analytics/funnel
                requestId: example-request-id
                status: 403
                timestamp: '2026-01-01T00:00:00Z'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Недостаточно прав или действие выключено в окружении
        '503':
          content:
            application/json:
              example:
                error: Service Unavailable
                message: Сервис временно недоступен — попробуйте позже
                path: /api/v1/analytics/funnel
                requestId: example-request-id
                status: 503
                timestamp: '2026-01-01T00:00:00Z'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Проверка сессии или почтовый канал временно недоступны
      security:
      - bearerAuth: []
      summary: Воронка, время на этапах и исходы решений за период (по умолчанию 30 дней)
      tags:
      - Аналитика конвейера
  /api/v1/applications:
    get:
      operationId: list
      parameters:
      - in: query
        name: status
        required: false
        schema:
          items:
            enum:
            - DRAFT
            - SUBMITTED
            - INFO_REQUESTED
            - ENRICHMENT
            - SCORING
            - MANUAL_REVIEW
            - OFFER_ISSUED
            - SIGNING
            - DISBURSING
            - DISBURSED
            - REJECTED
            - WITHDRAWN
            - CLOSED
            type: string
          type: array
          uniqueItems: true
      responses:
        '200':
          content:
            '*/*':
              schema:
                items:
                  $ref: '#/components/schemas/ApplicationSummary'
                type: array
          description: OK
        '401':
          content:
            application/json:
              example:
                error: Unauthorized
                message: Требуется вход в систему
                path: /api/v1/applications
                requestId: example-request-id
                status: 401
                timestamp: '2026-01-01T00:00:00Z'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Нет корректного токена
        '403':
          content:
            application/json:
              example:
                error: Forbidden
                message: Недостаточно прав для этого действия
                path: /api/v1/applications
                requestId: example-request-id
                status: 403
                timestamp: '2026-01-01T00:00:00Z'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Недостаточно прав или действие выключено в окружении
        '503':
          content:
            application/json:
              example:
                error: Service Unavailable
                message: Сервис временно недоступен — попробуйте позже
                path: /api/v1/applications
                requestId: example-request-id
                status: 503
                timestamp: '2026-01-01T00:00:00Z'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Проверка сессии или почтовый канал временно недоступны
      security:
      - bearerAuth: []
      summary: 'Заявки: клиенту — его компании, сотрудникам банка — очередь без черновиков'
      tags:
      - Заявки, документы и выдача
    post:
      operationId: create_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationRequest'
        required: true
      responses:
        '201':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ApplicationResponse'
          description: Created
        '400':
          content:
            application/json:
              example:
                error: Bad Request
                message: Проверьте поля запроса
                path: /api/v1/applications
                requestId: example-request-id
                status: 400
                timestamp: '2026-01-01T00:00:00Z'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Некорректные данные запроса
        '401':
          content:
            application/json:
              example:
                error: Unauthorized
                message: Требуется вход в систему
                path: /api/v1/applications
                requestId: example-request-id
