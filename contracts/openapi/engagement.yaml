components:
  schemas:
    Answer:
      properties:
        link:
          $ref: '#/components/schemas/AnswerLink'
        mode:
          enum:
          - MODEL
          - RULES
          type: string
        sources:
          items:
            type: string
          type: array
        text:
          type: string
      required:
      - mode
      - sources
      - text
      type: object
    AnswerLink:
      properties:
        label:
          type: string
        path:
          type: string
      required:
      - label
      - path
      type: object
    AssistantQuestion:
      properties:
        applicationId:
          format: uuid
          type: string
        history:
          items:
            $ref: '#/components/schemas/Turn'
          maxItems: 10
          minItems: 0
          type: array
        question:
          maxLength: 500
          minLength: 0
          type: string
      required:
      - history
      - question
      type: object
    AssistantStatus:
      properties:
        mode:
          enum:
          - MODEL
          - RULES
          type: string
        model:
          type: string
      required:
      - mode
      type: object
    ErrorResponse:
      description: Ошибка API
      properties:
        error:
          description: Название HTTP-статуса
          example: Not Found
          type: string
        message:
          description: Понятное объяснение ошибки
          example: Заявка не найдена
          type: string
        path:
          description: Путь запроса, который завершился ошибкой
          example: /api/v1/applications/00000000-0000-0000-0000-000000000001
          type: string
        requestId:
          type: string
        status:
          description: HTTP-код ошибки
          example: 404
          format: int32
          type: integer
        timestamp:
          format: date-time
          type: string
    NotificationPage:
      properties:
        items:
          items:
            $ref: '#/components/schemas/NotificationView'
          type: array
        page:
          format: int32
          type: integer
        size:
          format: int32
          type: integer
        total:
          format: int32
          type: integer
        unread:
          format: int32
          type: integer
      required:
      - items
      - page
      - size
      - total
      - unread
      type: object
    NotificationPreference:
      properties:
        emailEnabled:
          type: boolean
        version:
          format: int64
          type: integer
      required:
      - emailEnabled
      - version
      type: object
    NotificationSettings:
      properties:
        emailAvailable:
          type: boolean
        emailEnabled:
          type: boolean
        version:
          format: int64
          type: integer
      required:
      - emailAvailable
      - emailEnabled
      - version
      type: object
    NotificationView:
      properties:
        body:
          type: string
        createdAt:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        link:
          type: string
        read:
          type: boolean
        title:
          type: string
        type:
          enum:
          - APPLICATION_STATUS
          - ACTION_REQUIRED
          - NEW_REVIEW
          - APPLICATION_MESSAGE
          type: string
      required:
      - body
      - createdAt
      - id
      - read
      - title
      - type
      type: object
    SummaryRequest:
      properties:
        applicationId:
          format: uuid
          type: string
      required:
      - applicationId
      type: object
    SystemKeyError:
      properties:
        error:
          example: Unauthorized
          type: string
        message:
          example: Нужен ключ системы-клиента в заголовке X-Api-Key
          type: string
        status:
          example: 401
      required:
      - status
      - error
      - message
      type: object
    Turn:
      properties:
        role:
          type: string
        text:
          type: string
      required:
      - role
      - text
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
    systemKey:
      in: header
      name: X-Api-Key
      type: apiKey
info:
  description: REST API умного кредитного кабинета предпринимателя. Данные демо-стенда синтетические.
  title: 'Кабинет предпринимателя: уведомления и помощник'
  version: 0.1.0
openapi: 3.1.0
paths:
  /api/v1/assistant/messages:
    post:
      operationId: ask
      parameters:
      - in: header
        name: Authorization
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistantQuestion'
        required: true
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Answer'
          description: OK
        '400':
          content:
            application/json:
              example:
                error: Bad Request
                message: Проверьте поля запроса
                path: /api/v1/assistant/messages
                requestId: example-request-id
                status: 400
                timestamp: '2026-01-01T00:00:00Z'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Некорректные данные запроса
        '401':
          content:
            application/json:
              example:
                error: Unauthorized
                message: Требуется вход в систему
                path: /api/v1/assistant/messages
                requestId: example-request-id
                status: 401
                timestamp: '2026-01-01T00:00:00Z'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Нет корректного токена
        '403':
          content:
            application/json:
              example:
                error: Forbidden
                message: Недостаточно прав для этого действия
                path: /api/v1/assistant/messages
                requestId: example-request-id
                status: 403
                timestamp: '2026-01-01T00:00:00Z'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Недостаточно прав или действие выключено в окружении
        '409':
          content:
            application/json:
              example:
                error: Conflict
                message: Данные только что изменились — обновите страницу и повторите действие
                path: /api/v1/assistant/messages
                requestId: example-request-id
                status: 409
                timestamp: '2026-01-01T00:00:00Z'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Конфликт состояния, версии или повторной операции
        '429':
          content:
            application/json:
              example:
                error: Too Many Requests
                message: Слишком много запросов — повторите позже
                path: /api/v1/assistant/messages
                requestId: example-request-id
                status: 429
                timestamp: '2026-01-01T00:00:00Z'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Превышено ограничение частоты запросов
        '503':
          content:
            application/json:
              example:
                error: Service Unavailable
                message: Сервис временно недоступен — попробуйте позже
                path: /api/v1/assistant/messages
                requestId: example-request-id
                status: 503
                timestamp: '2026-01-01T00:00:00Z'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Проверка сессии или почтовый канал временно недоступны
      security:
      - bearerAuth: []
      summary: Вопрос помощнику о продуктах, статусе и решении по заявке
      tags:
      - Кредитный помощник
