components:
  schemas:
    AcceptInvitationRequest:
      properties:
        fullName:
          maxLength: 255
          minLength: 0
          type: string
        password:
          minLength: 1
          type: string
        personalDataConsent:
          type: boolean
        token:
          maxLength: 100
          minLength: 0
          type: string
      required:
      - fullName
      - password
      - personalDataConsent
      - token
      type: object
    AccessMessage:
      properties:
        message:
          type: string
      required:
      - message
      type: object
    AuthOptionsResponse:
      properties:
        demoAccounts:
          type: boolean
        mailAvailable:
          type: boolean
      required:
      - demoAccounts
      - mailAvailable
      type: object
    ChangePasswordRequest:
      properties:
        currentPassword:
          minLength: 1
          type: string
        password:
          minLength: 1
          type: string
      required:
      - currentPassword
      - password
      type: object
    CompanyMemberResponse:
      properties:
        canSign:
          type: boolean
        fullName:
          type: string
        id:
          format: uuid
          type: string
      required:
      - canSign
      - fullName
      - id
      type: object
    CompanyResponse:
      properties:
        id:
          format: uuid
          type: string
        inn:
          type: string
        legalForm:
          enum:
          - LEGAL_ENTITY
          - ENTREPRENEUR
          type: string
        members:
          items:
            $ref: '#/components/schemas/CompanyMemberResponse'
          type: array
        name:
          type: string
      required:
      - id
      - inn
      - legalForm
      - members
      type: object
    EmployeeListResponse:
      properties:
        canManage:
          type: boolean
        invitations:
          items:
            $ref: '#/components/schemas/InvitationResponse'
          type: array
        mailAvailable:
          type: boolean
        members:
          items:
            $ref: '#/components/schemas/UserResponse'
          type: array
      required:
      - canManage
      - invitations
      - mailAvailable
      - members
      type: object
    ErrorResponse:
      description: Ошибка API
      properties:
        error:
          description: Название HTTP-статуса
          example: Not Found
          type: string
        message:
          description: Понятное объяснение ошибки
          example: Заявка не найдена
          type: string
        path:
          description: Путь запроса, который завершился ошибкой
          example: /api/v1/applications/00000000-0000-0000-0000-000000000001
          type: string
        requestId:
          type: string
        status:
          description: HTTP-код ошибки
          example: 404
          format: int32
          type: integer
        timestamp:
          format: date-time
          type: string
    InspectInvitationRequest:
      properties:
        token:
          maxLength: 100
          minLength: 0
          type: string
      required:
      - token
      type: object
    InvitationPreview:
      properties:
        canSign:
          type: boolean
        companyName:
          type: string
        email:
          type: string
        expiresAt:
          format: date-time
          type: string
      required:
      - canSign
      - companyName
      - email
      - expiresAt
      type: object
    InvitationResponse:
      properties:
        canSign:
          type: boolean
        email:
          type: string
        expiresAt:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        link:
          type: string
        status:
          type: string
      required:
      - canSign
      - email
      - expiresAt
      - id
      - status
      type: object
    InviteEmployeeRequest:
      properties:
        canSign:
          type: boolean
        email:
          maxLength: 255
          minLength: 0
          type: string
      required:
      - canSign
      - email
      type: object
    RecoveryRequest:
      properties:
        email:
          maxLength: 255
          minLength: 0
          type: string
      required:
      - email
      type: object
    ResetPasswordRequest:
      properties:
        password:
          minLength: 1
          type: string
        token:
          maxLength: 100
          minLength: 0
          type: string
      required:
      - password
      - token
      type: object
    SignInRequest:
      properties:
        email:
          minLength: 1
          type: string
        password:
          minLength: 1
          type: string
      required:
      - email
      - password
      type: object
    SignUpRequest:
      properties:
        email:
          minLength: 1
          type: string
        fullName:
          maxLength: 255
          minLength: 0
          type: string
        inn:
          minLength: 1
          type: string
        password:
          minLength: 1
          type: string
        personalDataConsent:
          type: boolean
      required:
      - email
      - fullName
      - inn
      - password
      - personalDataConsent
      type: object
    SystemKeyError:
      properties:
        error:
          example: Unauthorized
          type: string
        message:
          example: Нужен ключ системы-клиента в заголовке X-Api-Key
          type: string
        status:
          example: 401
      required:
      - status
      - error
      - message
      type: object
    UpdateProfileRequest:
      properties:
        currentPassword:
          maxLength: 72
          minLength: 0
          type: string
        email:
          maxLength: 255
          minLength: 0
          type: string
        fullName:
          maxLength: 255
          minLength: 0
          type: string
      required:
      - email
      - fullName
      type: object
    UserResponse:
      properties:
        canSign:
          type: boolean
        companyId:
          format: uuid
          type: string
        email:
          type: string
        fullName:
          type: string
        id:
          format: uuid
          type: string
        role:
          enum:
          - CLIENT
          - MANAGER
          - UNDERWRITER
          - RISK_ADMIN
          type: string
        status:
          enum:
          - ACTIVE
          - BLOCKED
          type: string
      required:
      - canSign
      - email
      - fullName
      - id
      - role
      - status
      type: object
    UserSessionResponse:
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/UserResponse'
      required:
      - token
      - user
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
    systemKey:
      in: header
      name: X-Api-Key
      type: apiKey
info:
  description: REST API умного кредитного кабинета предпринимателя. Данные демо-стенда синтетические.
  title: 'Кабинет предпринимателя: пользователи, компании и вход'
  version: 0.1.0
openapi: 3.1.0
paths:
  /api/v1/auth/invitations/accept:
    post:
      operationId: accept
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvitationRequest'
        required: true
      responses:
        '200':
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UserSessionResponse'
          description: OK
        '400':
          content:
            application/json:
              example:
                error: Bad Request
                message: Проверьте поля запроса
                path: /api/v1/auth/invitations/accept
                requestId: example-request-id
                status: 400
                timestamp: '2026-01-01T00:00:00Z'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Некорректные данные запроса
        '409':
          content:
            application/json:
              example:
                error: Conflict
                message: Данные только что изменились — обновите страницу и повторите действие
                path: /api/v1/auth/invitations/accept
                requestId: example-request-id
                status: 409
                timestamp: '2026-01-01T00:00:00Z'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Конфликт состояния, версии или повторной операции
        '410':
          content:
            application/json:
              example:
                error: Gone
                message: Ссылка недействительна или срок её действия истёк. Запросите новую.
                path: /api/v1/auth/invitations/accept
                requestId: example-request-id
                status: 410
                timestamp: '2026-01-01T00:00:00Z'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Одноразовая ссылка истекла, отменена, использована или не найдена
        '429':
          content:
            application/json:
              example:
                error: Too Many Requests
                message: Слишком много запросов — повторите позже
                path: /api/v1/auth/invitations/accept
                requestId: example-request-id
                status: 429
                timestamp: '2026-01-01T00:00:00Z'
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Превышено ограничение частоты запросов
      security: []
      summary: Принять одноразовое приглашение с паролем и согласием на обработку данных
      tags:
      - Пароли и сотрудники компании
