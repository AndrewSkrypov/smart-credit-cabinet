syntax = "proto3";
package creditcabinet.documents.v1;
option java_package = "ru.creditcabinet.contracts.documents.v1";
option java_multiple_files = true;
// JSON is canonical frozen model data, bounded to 1 MiB, versioned independently.
// Only the allowlisted Credit mTLS identity may invoke these RPCs.
service DocumentsService {
  rpc ListDocuments(Scope) returns (Records);
  rpc PutDocument(PutRequest) returns (Empty);
  rpc ReadDocument(ObjectRequest) returns (Content);
  rpc DeleteDocument(ObjectRequest) returns (Empty);
  rpc ListArtifacts(Scope) returns (Records);
  rpc PrepareArtifact(Record) returns (Record);
  rpc RetryArtifact(ObjectRequest) returns (Record);
  rpc ReadArtifact(ObjectRequest) returns (Content);
}
message Empty {}
message Scope { string company_id = 1; string application_id = 2; int64 epoch = 3; }
message Record { Scope scope = 1; string metadata_json = 2; uint32 metadata_version = 3; }
message Records { repeated Record records = 1; }
message PutRequest { Record record = 1; bytes content = 2; }
message ObjectRequest { Scope scope = 1; string id = 2; string context = 3; string deleted_at = 4; }
message Content { bytes content = 1; string sha256 = 2; }
