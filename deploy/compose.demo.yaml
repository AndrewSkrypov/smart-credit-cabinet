# Applied only by Deployment for the isolated public demo project.
services:
  identity:
    environment:
      DEMO_ACCOUNTS: "true"
      CABINET_MAIL_MODE: "off"
  identity-migrate:
    environment:
      DEMO_ACCOUNTS: "true"
  engagement:
    environment:
      CABINET_MAIL_MODE: "off"
      OLLAMA_URL: ""
  caddy:
    environment:
      CABINET_DEMO_RESTRICTIONS: |
        @demo_account_routes path /api/v1/auth/sign-up* /api/v1/auth/password* /api/v1/auth/logout-all* /api/v1/companies/me/invitations* /api/v1/auth/invitations*
        @demo_profile_write {
            method PUT PATCH POST DELETE
            path /api/v1/users/me* /api/v1/companies/me/employees*
        }
        respond @demo_account_routes 404
        respond @demo_profile_write 404
