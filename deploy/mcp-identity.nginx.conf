worker_processes 1;
pid /tmp/nginx.pid;
daemon off;
error_log /dev/stderr crit;

events {
    worker_connections 128;
}

http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 1s;

    server {
        listen 8443 ssl;
        ssl_certificate /run/mcp/tls.crt;
        ssl_certificate_key /run/mcp/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 16k;
        client_header_timeout 3s;
        client_body_timeout 3s;
        proxy_http_version 1.1;
        proxy_set_header Host identity;
        proxy_set_header Cookie "";
        proxy_set_header Authorization $http_authorization;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
        proxy_send_timeout 3s;
        proxy_next_upstream off;
        set $identity http://identity:8080;

        location = /internal/mcp/authorize {
            if ($request_method != POST) { return 405; }
            proxy_pass $identity/internal/mcp/authorize;
        }
        location = /internal/mcp/redeem {
            if ($request_method != POST) { return 405; }
            proxy_pass $identity/internal/mcp/redeem;
        }
        location / { return 404; }
    }
}
