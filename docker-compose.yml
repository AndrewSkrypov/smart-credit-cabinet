# The whole cabinet on one machine: docker compose up --build, then http://localhost:8080.
# Allow 8 GiB with the antivirus engine; the optional assistant model needs additional memory.
# A fixed project name: the default comes from the folder name, which may not be ASCII.
name: smart-credit-cabinet

x-service: &service
  build:
    context: .
    dockerfile: docker/service/Dockerfile
  mem_limit: 640m
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]
    interval: 10s
    timeout: 5s
    retries: 30
  networks:
    - cabinet

x-service-env: &service-env
  DB_HOST: postgres
  DB_PORT: 5432
  SPRING_FLYWAY_ENABLED: "false"
  CABINET_DATABASE_GUARD_ENABLED: "true"
  JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me-32bytes+}
  CABINET_VALKEY_ENABLED: "true"
  CABINET_VALKEY_HOST: valkey
  CABINET_VALKEY_PASSWORD: ${VALKEY_PASSWORD:-dev-valkey-password-change-before-deployment}
  CABINET_MAIL_MODE: ${MAIL_MODE:-auto}
  CABINET_MAIL_HOST: ${SMTP_HOST:-mailpit}
  CABINET_MAIL_PORT: ${SMTP_PORT:-1025}
  CABINET_MAIL_FROM: ${SMTP_FROM:-cabinet@demo.test}
  CABINET_MAIL_USERNAME: ${SMTP_USERNAME:-}
  CABINET_MAIL_PASSWORD: ${SMTP_PASSWORD:-}
  CABINET_MAIL_STARTTLS: ${SMTP_START_TLS:-false}
  CABINET_MAIL_PUBLICCABINETURL: ${PUBLIC_CABINET_URL:-http://localhost:8080}

x-postgres: &postgres
  image: cabinet/postgres:16.15-alpine-su-exec-0.3
  build:
    context: .
    dockerfile: docker/postgres/Dockerfile

services:
  valkey:
    image: valkey/valkey:9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    mem_limit: 128m
    restart: unless-stopped
    entrypoint: [/bin/sh, /cabinet/start.sh]
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:-dev-valkey-password-change-before-deployment}
    volumes:
      - ./docker/valkey/start.sh:/cabinet/start.sh:ro
      - cabinet-valkey:/data
    healthcheck:
      test: [CMD-SHELL, 'VALKEYCLI_AUTH="$$VALKEY_PASSWORD" valkey-cli ping | grep -qx PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [cabinet]
  seaweedfs:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    profiles: [storage]
    mem_limit: 512m
    restart: unless-stopped
    entrypoint: [/bin/sh, /cabinet/start.sh]
    environment:
      S3_BUCKET: ${S3_BUCKET:-cabinet-documents}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-dev-cabinet-storage}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-dev-storage-secret-change-me}
      S3_ADMIN_ACCESS_KEY: ${S3_ADMIN_ACCESS_KEY:-dev-storage-operator}
      S3_ADMIN_SECRET_KEY: ${S3_ADMIN_SECRET_KEY:-dev-storage-operator-secret-change-me}
      GOMEMLIMIT: 384MiB
    volumes:
      - ./docker/seaweedfs/start.sh:/cabinet/start.sh:ro
      - cabinet-seaweedfs:/data
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [cabinet]
  clamav:
    image: clamav/clamav:1.5.4@sha256:e19130cdebaeacc71fa46eab3ed6f69941f2f22aa5e08d55e9197f8edf43ce5e
    # The official image is built for x86-64 only; on ARM hosts (Apple Silicon) Docker runs it emulated.
    platform: linux/amd64
    mem_limit: 2g
    restart: unless-stopped
    environment:
      TZ: UTC
      ANTIVIRUS_MAX_SIGNATURE_AGE: ${ANTIVIRUS_MAX_SIGNATURE_AGE:-PT72H}
    # The image initializes its main config; keep our read-only source at a separate path.
    entrypoint: [/bin/sh, -c, "cp /cabinet/clamd.conf /etc/clamav/clamd.conf && exec /init"]
    volumes:
      - ./docker/clamav/clamd.conf:/cabinet/clamd.conf:ro
      - ./docker/clamav/healthcheck.sh:/cabinet/healthcheck.sh:ro
      - cabinet-clamav-signatures:/var/lib/clamav
    healthcheck:
      test: [CMD, /bin/sh, /cabinet/healthcheck.sh]
      interval: 10s
      timeout: 5s
      retries: 36
      start_period: 60s
    networks: [cabinet]
  mailpit:
    image: axllent/mailpit:v1.31.6@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
    profiles: [mail]
    mem_limit: 128m
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 1000
    volumes:
      - cabinet-mailpit:/data
    networks: [cabinet]
  prometheus:
    image: prom/prometheus:v3.15.1
    profiles: ["monitoring"]
    mem_limit: 256m
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=512MB
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./monitoring/rules.test.yml:/etc/prometheus/rules.test.yml:ro
      - cabinet-prometheus:/prometheus
    networks: [cabinet]

  grafana:
    image: grafana/grafana:13.2.4
    profiles: ["monitoring"]
    mem_limit: 512m
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-local-monitoring-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GOMEMLIMIT: 384MiB
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - cabinet-grafana:/var/lib/grafana
    depends_on: [prometheus]
    networks: [cabinet]

  postgres:
    <<: *postgres
    environment:
      POSTGRES_DB: cabinet
      POSTGRES_USER: ${POSTGRES_USER:-cabinet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cabinet}
    volumes:
      - cabinet-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cabinet} -d cabinet"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - cabinet

  # One database per service on the shared local Postgres. The official image runs init
  # scripts only on an empty volume, so this runs at every start and is idempotent.
  db-init:
    <<: *postgres
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-cabinet}
      PGPASSWORD: ${POSTGRES_PASSWORD:-cabinet}
      PGDATABASE: cabinet
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:-dev-identity-runtime-password}
      CREDIT_DB_PASSWORD: ${CREDIT_DB_PASSWORD:-dev-credit-runtime-password}
      ENGAGEMENT_DB_PASSWORD: ${ENGAGEMENT_DB_PASSWORD:-dev-engagement-runtime-password}
      IDENTITY_MIGRATION_PASSWORD: ${IDENTITY_MIGRATION_PASSWORD:-dev-identity-owner-password}
      CREDIT_MIGRATION_PASSWORD: ${CREDIT_MIGRATION_PASSWORD:-dev-credit-owner-password}
      ENGAGEMENT_MIGRATION_PASSWORD: ${ENGAGEMENT_MIGRATION_PASSWORD:-dev-engagement-owner-password}
    volumes:
      - ./docker/postgres/bootstrap.sh:/cabinet/bootstrap.sh:ro
      - ./libs/platform-common/src/main/resources/cabinet/database-permissions.sql:/cabinet/database-permissions.sql:ro
    command: [sh, /cabinet/bootstrap.sh]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cabinet

  identity-migrate:
    image: ${COMPOSE_PROJECT_NAME:-smart-credit-cabinet}-identity:latest
    pull_policy: never
    mem_limit: 192m
    restart: "no"
    environment:
      MIGRATION_ONLY: "true"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: identity
      DB_USER: identity_owner
      DB_PASSWORD: ${IDENTITY_MIGRATION_PASSWORD:-dev-identity-owner-password}
      DEMO_ACCOUNTS: ${DEMO_ACCOUNTS:-true}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=55 -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError
    depends_on:
      db-init:
        condition: service_completed_successfully
    networks: [cabinet]

  credit-migrate:
    image: ${COMPOSE_PROJECT_NAME:-smart-credit-cabinet}-credit:latest
    pull_policy: never
    mem_limit: 192m
    restart: "no"
    environment:
      MIGRATION_ONLY: "true"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: credit
      DB_USER: credit_owner
      DB_PASSWORD: ${CREDIT_MIGRATION_PASSWORD:-dev-credit-owner-password}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=55 -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError
    depends_on:
      db-init:
        condition: service_completed_successfully
    networks: [cabinet]

  engagement-migrate:
    image: ${COMPOSE_PROJECT_NAME:-smart-credit-cabinet}-engagement:latest
    pull_policy: never
    mem_limit: 192m
    restart: "no"
    environment:
      MIGRATION_ONLY: "true"
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: engagement
      DB_USER: engagement_owner
      DB_PASSWORD: ${ENGAGEMENT_MIGRATION_PASSWORD:-dev-engagement-owner-password}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=55 -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError
    depends_on:
      db-init:
        condition: service_completed_successfully
    networks: [cabinet]

  identity:
    <<: *service
    image: ${COMPOSE_PROJECT_NAME:-smart-credit-cabinet}-identity:latest
    build:
      context: .
      dockerfile: docker/service/Dockerfile
      args:
        SERVICE: identity
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    environment:
      <<: *service-env
      DB_NAME: identity
      DB_USER: identity_app
      DB_PASSWORD: ${IDENTITY_DB_PASSWORD:-dev-identity-runtime-password}
      IDENTITY_LINK_KEY: ${IDENTITY_LINK_KEY:-dev-identity-links-change-before-deployment-48bytes}
      IDENTITY_LINK_KEY_VERSION: ${IDENTITY_LINK_KEY_VERSION:-1}
      DEMO_ACCOUNTS: ${DEMO_ACCOUNTS:-true}
      REGISTRY_URL: http://external-sim:8080
      ENGAGEMENT_URL: http://engagement:8080
      SIM_API_KEY: ${SIM_API_KEY:-dev-sim-api-key}
    depends_on:
      valkey:
        condition: service_healthy
      identity-migrate:
        condition: service_completed_successfully

  credit:
    <<: *service
    image: ${COMPOSE_PROJECT_NAME:-smart-credit-cabinet}-credit:latest
    build:
      context: .
      dockerfile: docker/service/Dockerfile
      args:
        SERVICE: credit
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    environment:
      <<: *service-env
      DB_NAME: credit
      DB_USER: credit_app
      DB_PASSWORD: ${CREDIT_DB_PASSWORD:-dev-credit-runtime-password}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      DOCUMENT_UPLOADS_ENABLED: ${DOCUMENT_UPLOADS_ENABLED:-true}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://seaweedfs:8333}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-cabinet-documents}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-dev-cabinet-storage}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-dev-storage-secret-change-me}
      ANTIVIRUS_ENABLED: "true"
      ANTIVIRUS_HOST: clamav
      ANTIVIRUS_TIMEOUT: ${ANTIVIRUS_TIMEOUT:-PT10S}
      ANTIVIRUS_MAX_SIGNATURE_AGE: ${ANTIVIRUS_MAX_SIGNATURE_AGE:-PT72H}
      IDENTITY_URL: http://identity:8080
      ENGAGEMENT_URL: http://engagement:8080
      EXTERNAL_SIM_URL: http://external-sim:8080
      SIM_API_KEY: ${SIM_API_KEY:-dev-sim-api-key}
      # Demo timings: a whole scenario, expiry included, fits into minutes.
      INFO_REQUEST_TTL: ${INFO_REQUEST_TTL:-PT30M}
      OFFER_TTL: ${OFFER_TTL:-PT30M}
      SOURCE_TIMEOUT: ${SOURCE_TIMEOUT:-PT3M}
    volumes:
      - cabinet-documents:/app/uploads
    depends_on:
      valkey:
        condition: service_healthy
      credit-migrate:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy

  engagement:
    <<: *service
    image: ${COMPOSE_PROJECT_NAME:-smart-credit-cabinet}-engagement:latest
    build:
      context: .
      dockerfile: docker/service/Dockerfile
      args:
        SERVICE: engagement
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    environment:
      <<: *service-env
      DB_NAME: engagement
      DB_USER: engagement_app
      DB_PASSWORD: ${ENGAGEMENT_DB_PASSWORD:-dev-engagement-runtime-password}
      IDENTITY_URL: http://identity:8080
      CREDIT_URL: http://credit:8080
      # The assistant uses the model when the "ai" profile runs, and answers by rules otherwise.
      OLLAMA_URL: ${OLLAMA_URL-http://ollama:11434}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-qwen2.5:3b}
    depends_on:
      valkey:
        condition: service_healthy
      engagement-migrate:
        condition: service_completed_successfully

  external-sim:
    <<: *service
    build:
      context: .
      dockerfile: docker/service/Dockerfile
      args:
        SERVICE: external-sim
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    mem_limit: 512m
    environment:
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me-32bytes+}
      SIM_API_KEY: ${SIM_API_KEY:-dev-sim-api-key}
      SIM_CONTROL_ENABLED: ${SIM_CONTROL_ENABLED:-true}

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-unknown}
    mem_limit: 128m
    restart: unless-stopped
    networks:
      - cabinet

  # The assistant's language model with open weights: docker compose --profile ai up -d.
  # About 1 GB of weights is downloaded once into the volume; answers take seconds on a CPU.
  ollama:
    image: ollama/ollama:0.40.8@sha256:2b8eecdb85aa6ea67c381c8ecffec04b2658496cf2821a8f88b0485bdff198e8
    profiles: ["ai"]
    mem_limit: 4g
    volumes:
      - cabinet-ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - cabinet

  ollama-pull:
    image: ollama/ollama:0.40.8@sha256:2b8eecdb85aa6ea67c381c8ecffec04b2658496cf2821a8f88b0485bdff198e8
    profiles: ["ai"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${ASSISTANT_MODEL:-qwen2.5:3b}"]
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - cabinet

  swagger-ui:
    image: swaggerapi/swagger-ui:v5.34.0@sha256:58c1fbf5f5cf6d2ae857e4d1296cb02192fa5de472c1cd76f58b2be99523e1d0
    mem_limit: 128m
    environment:
      BASE_URL: /swagger
      URLS: >-
        [{"url":"/v3/api-docs/identity","name":"identity"},
        {"url":"/v3/api-docs/credit","name":"credit"},
        {"url":"/v3/api-docs/engagement","name":"engagement"},
        {"url":"/v3/api-docs/external-sim","name":"external-sim"}]
    networks:
      - cabinet

  gateway:
    image: nginx:1.30.5-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./docker/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - identity
      - credit
      - engagement
      - external-sim
      - swagger-ui
    networks:
      - cabinet

volumes:
  cabinet-valkey:
  cabinet-seaweedfs:
  cabinet-clamav-signatures:
  cabinet-mailpit:
  cabinet-prometheus:
  cabinet-grafana:
  cabinet-postgres-data:
  cabinet-documents:
  cabinet-ollama:

networks:
  cabinet:
