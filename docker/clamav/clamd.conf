# Private INSTREAM service; no application document volume is mounted here.
LogFile /var/log/clamav/clamd.log
LogTime yes
LogFileMaxSize 2M
LocalSocket /tmp/clamd.sock
TCPSocket 3310
User clamav
DatabaseDirectory /var/lib/clamav
# A first freshclam update can finish before clamd opens its notification socket.
SelfCheck 30
# Two simultaneous signature engines exceed the bounded 2 GiB container budget.
ConcurrentDatabaseReload no
MaxThreads 4
MaxQueue 16
CommandReadTimeout 5
ReadTimeout 10
StreamMaxLength 21M
MaxScanTime 8000
MaxFileSize 25M
MaxScanSize 50M
MaxRecursion 16
MaxFiles 1000
ScanArchive yes
AlertExceedsMax yes
AlertEncrypted yes
