    # Local synthetic Credit MCP routes are outside the public gateway.
    location ~ ^/api/v1/agent/mcp(?:/|$) {
        return 404;
    }

    location /api/v1/agent/clients {
        proxy_read_timeout 10s;
        proxy_pass $identity;
    }

    location /api/v1/agent {
        error_page 418 = @credit_read;
        if ($credit_safe_read) { return 418; }
        proxy_read_timeout 20s;
        proxy_pass $credit;
    }
