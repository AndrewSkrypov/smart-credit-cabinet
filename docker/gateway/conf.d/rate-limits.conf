# Brute force on sign-in and sign-up: 30 requests a minute per client address (identity also
# limits wrong passwords per account).
limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;

# Empty keys leave unrelated routes outside these budgets. The original URI keeps the
# same classification when a safe read is dispatched to the named credit location.
map $uri $client_contour {
    default "";
    ~^/api/v1/(?:applications|products|pre-approved-offers|loans)(?:/|$) $binary_remote_addr;
}
map $uri $agent_contour {
    default "";
    ~^/api/v1/agent(?:/|$) $binary_remote_addr;
}
map $uri $bank_contour {
    default "";
    ~^/api/v1/(?:bank|underwriting|rules|analytics)(?:/|$) $binary_remote_addr;
}
limit_req_zone $client_contour zone=client:10m rate=60r/s;
limit_req_zone $agent_contour zone=agent:10m rate=30r/s;
limit_req_zone $bank_contour zone=bank:10m rate=40r/s;
