# Single entry point of the cabinet: routes by path to the service that owns it, like an
# Ingress would in a cluster. Dynamic resolution keeps a missing service from preventing
# startup. Credit peers share failure state across workers (open-source Nginx >=1.27.3).
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 1s;

upstream cabinet_credit {
    zone cabinet_credit 64k;
    server credit:8080 resolve max_fails=1 fail_timeout=5s;
}

map $request_method $credit_safe_read {
    default 0;
    GET 1;
    HEAD 1;
}

# Brute force on sign-in and sign-up: 30 requests a minute per client address (identity also
# limits wrong passwords per account).
limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 20m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 1s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    # Explicit for every other method, including PUT and DELETE, and for other services.
    proxy_next_upstream off;

    set $identity http://identity:8080;
    set $credit http://cabinet_credit;
    set $engagement http://engagement:8080;
    set $sim http://external-sim:8080;
    set $swagger http://swagger-ui:8080;
    set $frontend http://frontend:8080;

    # Service-to-service APIs and the simulated external systems are never published.
    location /internal/ {
        return 404;
    }

    location /ext/ {
        return 404;
    }

    # --- identity ---
    location /api/v1/auth/ {
        limit_req zone=auth burst=20 nodelay;
        limit_req_status 429;
        error_page 429 = @auth_rate_limit;
        proxy_pass $identity;
    }

    location @auth_rate_limit {
        default_type application/json;
        # Location headers replace inherited headers, including the security defaults.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Request-Id $request_id always;
        add_header Retry-After 2 always;
        # A fixed zone path avoids reflecting unescaped request data into JSON.
        return 429 '{"timestamp":"$time_iso8601","status":429,"error":"Too Many Requests","message":"Слишком много запросов. Попробуйте через минуту.","path":"/api/v1/auth/","requestId":"$request_id"}';
    }

    location /api/v1/users {
        proxy_pass $identity;
    }

    location /api/v1/companies {
        proxy_pass $identity;
    }

    # --- credit ---
    # A return-only rewrite is safe here. Named location preserves URI, arguments and
    # the GET/HEAD method; no external 418 and no retry of a partially sent response.
    # Timeouts are inactivity limits, not an absolute streaming-response deadline.
    location @credit_read {
        proxy_pass $credit;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 8s;
    }

    location /api/v1/bank/products {
        error_page 418 = @credit_read;
        if ($credit_safe_read) { return 418; }
        proxy_pass $credit;
    }

    location /api/v1/products {
        error_page 418 = @credit_read;
        if ($credit_safe_read) { return 418; }
        proxy_pass $credit;
    }

    location /api/v1/applications {
        error_page 418 = @credit_read;
        if ($credit_safe_read) { return 418; }
        proxy_pass $credit;
    }

    location /api/v1/underwriting {
        error_page 418 = @credit_read;
        if ($credit_safe_read) { return 418; }
        proxy_pass $credit;
    }

    location /api/v1/rules {
        error_page 418 = @credit_read;
        if ($credit_safe_read) { return 418; }
        proxy_pass $credit;
    }

    location /api/v1/analytics {
        error_page 418 = @credit_read;
        if ($credit_safe_read) { return 418; }
        proxy_pass $credit;
    }

    # --- engagement ---
    location /api/v1/notifications {
        proxy_pass $engagement;
    }

    location /api/v1/assistant {
        proxy_pass $engagement;
        # Answers of a local model on a laptop CPU can take a while.
        proxy_read_timeout 120s;
    }

    # --- simulators: only the demo control panel (make a source slow or unavailable) ---
    location /sim/ {
        proxy_pass $sim;
    }

    # --- API docs of each service: /v3/api-docs/<service> ---
    location /v3/api-docs/identity {
        proxy_pass $identity;
    }

    location /v3/api-docs/credit {
        error_page 418 = @credit_read;
        if ($credit_safe_read) { return 418; }
        proxy_pass $credit;
    }

    location /v3/api-docs/engagement {
        proxy_pass $engagement;
    }

    location /v3/api-docs/external-sim {
        proxy_pass $sim;
    }

    # One Swagger UI over the API docs of all services.
    location /swagger/ {
        proxy_pass $swagger;
    }

    # --- the SPA ---
    location / {
        proxy_pass $frontend;
    }
}
