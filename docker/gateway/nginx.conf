include /etc/nginx/cabinet-gateway/upstreams.conf;
include /etc/nginx/cabinet-gateway/rate-limits.conf;

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 20m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 1s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    # Only the explicit GET/HEAD credit location may retry, including connection failures.
    proxy_next_upstream off;

    set $identity http://identity:8080;
    set $credit http://cabinet_credit;
    # Resolve reads into a request-owned address list. A shared resolve zone can shrink
    # to one peer while a request is waiting, clearing its remaining retry on failure.
    set $credit_read_upstream http://credit:8080;
    set $engagement http://engagement:8080;
    set $sim http://external-sim:8080;
    set $swagger http://swagger-ui:8080;
    set $frontend http://frontend:8080;

    include /etc/nginx/cabinet-gateway/internal-deny.conf;
    include /etc/nginx/cabinet-gateway/identity.conf;
    include /etc/nginx/cabinet-gateway/credit-read.conf;
    include /etc/nginx/cabinet-gateway/client.conf;
    include /etc/nginx/cabinet-gateway/bank.conf;
    include /etc/nginx/cabinet-gateway/agent.conf;
    include /etc/nginx/cabinet-gateway/engagement.conf;
    include /etc/nginx/cabinet-gateway/public.conf;
}
