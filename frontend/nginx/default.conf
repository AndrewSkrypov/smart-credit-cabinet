# Serves the built SPA only. API routing lives in front of this container:
# the Kubernetes Ingress in clusters, docker/gateway/nginx.conf in docker compose.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # No nginx version in headers and error pages.
    server_tokens off;

    # Paths that are never pages of the app: service APIs not routed here, dot files, server
    # scripts that scanners probe. A plain 404 instead of the SPA, which would answer 200.
    location ~ ^/(api|internal|actuator|v3|swagger-ui)(/|$) {
        return 404;
    }
    location ~ /\. {
        return 404;
    }
    location ~ \.(php|asp|aspx|jsp|cgi|env|ini|sql|bak)$ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
