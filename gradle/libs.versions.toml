[versions]
kotlin = "2.1.21"
spring-boot = "3.5.16"
spring-dependency-management = "1.1.7"
jjwt = "0.12.6"
springdoc = "2.8.9"
aws-sdk = "2.55.13"
jackson = "2.21.7"
valkey-java = "5.5.0"
ktlint-gradle = "13.1.0"
mockito-kotlin = "5.4.0"
resilience4j = "2.3.0"
license-report = "3.1.4"

[plugins]
license-report = { id = "com.github.jk1.dependency-license-report", version.ref = "license-report" }

[libraries]
# Gradle plugins, used by build-logic convention plugins
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-allopen = { module = "org.jetbrains.kotlin:kotlin-allopen", version.ref = "kotlin" }
kotlin-noarg = { module = "org.jetbrains.kotlin:kotlin-noarg", version.ref = "kotlin" }
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
ktlint-gradle-plugin = { module = "org.jlleitschuh.gradle:ktlint-gradle", version.ref = "ktlint-gradle" }
spring-dependency-management-plugin = { module = "io.spring.gradle:dependency-management-plugin", version.ref = "spring-dependency-management" }

# Runtime libraries not covered by the Spring Boot BOM
jjwt-api = { module = "io.jsonwebtoken:jjwt-api", version.ref = "jjwt" }
jjwt-impl = { module = "io.jsonwebtoken:jjwt-impl", version.ref = "jjwt" }
jjwt-jackson = { module = "io.jsonwebtoken:jjwt-jackson", version.ref = "jjwt" }
springdoc-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
aws-sdk-bom = { module = "software.amazon.awssdk:bom", version.ref = "aws-sdk" }
aws-sdk-s3 = { module = "software.amazon.awssdk:s3" }
aws-sdk-url-connection-client = { module = "software.amazon.awssdk:url-connection-client" }
valkey-java = { module = "io.valkey:valkey-java", version.ref = "valkey-java" }
resilience4j-circuitbreaker = { module = "io.github.resilience4j:resilience4j-circuitbreaker", version.ref = "resilience4j" }

# Tests
mockito-kotlin = { module = "org.mockito.kotlin:mockito-kotlin", version.ref = "mockito-kotlin" }
