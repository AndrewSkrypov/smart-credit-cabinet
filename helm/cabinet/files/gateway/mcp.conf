    location = /api/mcp {
        access_log off;
        error_log /dev/stderr crit;
        client_max_body_size 64k;
        proxy_buffering off;
        proxy_pass $cabinet_mcp;
    }
    location = /.well-known/oauth-protected-resource/api/mcp {
        access_log off;
        error_log /dev/stderr crit;
        proxy_pass $cabinet_mcp;
    }
    location = /.well-known/oauth-authorization-server {
        access_log off;
        error_log /dev/stderr crit;
        proxy_pass $identity;
    }
    location = /api/mcp/oauth/authorize {
        access_log off;
        error_log /dev/stderr crit;
        client_max_body_size 16k;
        proxy_pass $identity;
    }
    location = /api/mcp/oauth/token {
        access_log off;
        error_log /dev/stderr crit;
        client_max_body_size 16k;
        proxy_pass $identity;
    }
    location = /api/mcp/oauth/revoke {
        access_log off;
        error_log /dev/stderr crit;
        client_max_body_size 16k;
        proxy_pass $identity;
    }
    location ^~ /api/mcp/ { return 404; }
