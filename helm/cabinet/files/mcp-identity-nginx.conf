pid /tmp/nginx.pid;
error_log /dev/stderr error;
events { worker_connections 128; }
http {
    access_log off;
    client_body_temp_path /tmp/client-body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    server {
        listen 8444 ssl;
        server_tokens off;
        ssl_certificate /run/mcp-identity-tls/tls.crt;
        ssl_certificate_key /run/mcp-identity-tls/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        client_max_body_size 16k;
        proxy_connect_timeout 1s;
        proxy_read_timeout 3s;
        proxy_send_timeout 3s;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header Cookie "";
        location = /internal/mcp/authorize {
            if ($request_method != POST) { return 405; }
            if ($args != "") { return 400; }
            proxy_pass http://127.0.0.1:8080/internal/mcp/authorize;
        }
        location = /internal/mcp/redeem {
            if ($request_method != POST) { return 405; }
            if ($args != "") { return 400; }
            proxy_pass http://127.0.0.1:8080/internal/mcp/redeem;
        }
        location / { return 404; }
    }
}
