{{- if .Values.app.enabled }}
{{- $root := . }}
{{- $revision := required "release.revision must match the immutable release manifest" .Values.release.revision }}
{{- if not (regexMatch "^[a-f0-9]{40}$" $revision) }}
{{- fail "release.revision must be a full 40-character Git SHA" }}
{{- end }}
{{- $publicURL := required "app.publicURL must be the external HTTPS URL" .Values.app.publicURL }}
{{- if not (hasPrefix "https://" $publicURL) }}
{{- fail "app.publicURL must use HTTPS" }}
{{- end }}
{{- range $image, $workload := .Values.workloads }}
{{- $name := ternary "swagger-ui" $image (eq $image "swagger") }}
{{- $backend := has $name (list "identity" "credit" "engagement" "external-sim") }}
{{- $db := and $backend (ne $name "external-sim") }}
{{- $documents := and (eq $name "credit") (($root.Values.documents | default dict).enabled) }}
{{- $catalog := and (eq $name "credit") $root.Values.catalog.enabled }}
{{- $mcp := and (eq $name "credit") $root.Values.agentMcpCredit.enabled }}
{{- $assessment := and (eq $name "credit") (($root.Values.assessment | default dict).enabled) }}
{{- $replicas := int $workload.replicas }}
{{- if or (lt $replicas 1) (and (eq $name "external-sim") (ne $replicas 1)) }}
{{- fail (printf "invalid replicas for %s; external-sim must stay singleton" $name) }}
{{- end }}
{{- if and (eq $name "gateway") $root.Values.catalog.maintenance }}
{{- $replicas = 0 }}
{{- end }}
{{- $port := ternary 80 8080 (eq $name "gateway") }}
{{- $probe := "/actuator/health" }}
{{- if eq $name "gateway" }}{{- $probe = "/healthz" }}{{- end }}
{{- if eq $name "frontend" }}{{- $probe = "/" }}{{- end }}
{{- if eq $name "swagger-ui" }}{{- $probe = "/swagger/" }}{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  selector:
    {{- include "cabinet.selector" (list $root $name) | nindent 4 }}
  {{- if eq $name "gateway" }}
  {{- $type := $root.Values.gateway.service.type }}
  {{- if not (has $type (list "ClusterIP" "NodePort")) }}
  {{- fail "gateway.service.type must be ClusterIP or NodePort; the existing LB is managed outside Helm" }}
  {{- end }}
  type: {{ $type }}
  {{- if eq $type "NodePort" }}
  externalTrafficPolicy: {{ $root.Values.gateway.service.externalTrafficPolicy }}
  {{- end }}
  {{- end }}
  ports:
    - name: http
      port: {{ $port }}
      targetPort: http
      {{- if and (eq $name "gateway") (eq $root.Values.gateway.service.type "NodePort") }}
      nodePort: {{ required "gateway.service.nodePort must match the existing LB target" $root.Values.gateway.service.nodePort }}
      {{- end }}
{{- if eq $name "credit" }}
---
apiVersion: v1
kind: Service
metadata:
  name: credit-read
spec:
  # Keep ordinary clients on the stable ClusterIP. Only the nginx safe-read
  # path gets a snapshot of ready pod addresses for one bounded retry.
  clusterIP: None
  selector:
    {{- include "cabinet.selector" (list $root $name) | nindent 4 }}
  ports:
    - {name: http, port: 8080, targetPort: http}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  annotations:
    cabinet.release/revision: {{ $revision | quote }}
spec:
  replicas: {{ $replicas }}
  revisionHistoryLimit: 5
  strategy:
    {{- if eq $name "external-sim" }}
    type: Recreate
    {{- else }}
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
    {{- end }}
  selector:
    matchLabels:
      {{- include "cabinet.selector" (list $root $name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cabinet.selector" (list $root $name) | nindent 8 }}
      annotations:
        cabinet.release/revision: {{ $revision | quote }}
        {{- if $backend }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /actuator/prometheus
        {{- end }}
        {{- if eq $name "gateway" }}
        checksum/gateway: {{ include (print $root.Template.BasePath "/gateway-config.yaml") $root | sha256sum | quote }}
        {{- end }}
    spec:
      {{- include "cabinet.pod" $root | nindent 6 }}
      {{- $bridge := and (eq $name "engagement") $root.Values.ollamaBridge.enabled }}
      {{- if $bridge }}
      securityContext:
        fsGroup: 10002
      {{- end }}
      {{- if has $name (list "gateway" "engagement") }}
      terminationGracePeriodSeconds: 150
      {{- end }}
      {{- if gt $replicas 1 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "cabinet.selector" (list $root $name) | nindent 14 }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ include "cabinet.image" (list $root $image) | quote }}
          ports:
            - {name: http, containerPort: {{ $port }}}
          resources:
            {{- toYaml $workload.resources | nindent 12 }}
          startupProbe:
            httpGet: {path: {{ $probe }}, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: {{ $probe }}, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket: {port: http}
            periodSeconds: 10
          {{- if $backend }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            capabilities: {drop: [ALL]}
          {{- if $assessment }}
          envFrom:
            - configMapRef: {name: assessment-credit-transport}
          {{- end }}
          env:
            - {name: SPRING_PROFILES_ACTIVE, value: {{ ternary "prod,agent-mcp-remote" "prod" $mcp | quote }}}
            {{- if $mcp }}
            - {name: SERVER_FORWARD_HEADERS_STRATEGY, value: none}
            - {name: CABINET_MCP_IDENTITY_ORIGIN, value: {{ required "agentMcpCredit.identityOrigin is required" $root.Values.agentMcpCredit.identityOrigin | quote }}}
            - {name: CABINET_MCP_IDENTITY_CA, value: /run/mcp-credit-tls/identity-ca.crt}
            - {name: CABINET_MCP_CREDIT_TLS_CERT, value: /run/mcp-credit-tls/tls.crt}
            - {name: CABINET_MCP_CREDIT_TLS_KEY, value: /run/mcp-credit-tls/tls.key}
            - {name: CABINET_MCP_CREDIT_TLS_PEER_CA, value: /run/mcp-credit-tls/peer-ca.crt}
            - {name: CABINET_MCP_CREDIT_TLS_PEER_SHA256, value: {{ required "agentMcpCredit.peerSha256 is required" $root.Values.agentMcpCredit.peerSha256 | quote }}}
            {{- include "cabinet.secretFrom" (list (required "agentMcpCredit.redemptionSecret is required" $root.Values.agentMcpCredit.redemptionSecret) "MCP_CREDIT_SERVICE_TOKEN" "token") | nindent 12 }}
            {{- end }}
            - {name: JAVA_TOOL_OPTIONS, value: "-XX:MaxRAMPercentage=55 -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError"}
            - {name: LOGGING_STRUCTURED_FORMAT_CONSOLE, value: logstash}
            {{- if $root.Values.app.otlpEndpoint }}
            - {name: MANAGEMENT_OTLP_TRACING_EXPORT_ENABLED, value: "true"}
            - {name: MANAGEMENT_OTLP_TRACING_ENDPOINT, value: {{ $root.Values.app.otlpEndpoint | quote }}}
            {{- else }}
            - {name: MANAGEMENT_OTLP_TRACING_EXPORT_ENABLED, value: "false"}
            {{- end }}
            {{- include "cabinet.secret" (list $root "JWT_SECRET" "JWT_SECRET") | nindent 12 }}
            - {name: CABINET_VALKEY_ENABLED, value: "true"}
            - {name: CABINET_VALKEY_HOST, value: valkey}
            {{- include "cabinet.secret" (list $root "CABINET_VALKEY_PASSWORD" "VALKEY_PASSWORD") | nindent 12 }}
            {{- if $db }}
            - {name: SPRING_FLYWAY_ENABLED, value: "false"}
            - {name: CABINET_DATABASE_GUARD_ENABLED, value: "true"}
            - {name: CABINET_MAIL_PUBLICCABINETURL, value: {{ $publicURL | quote }}}
            {{- include "cabinet.db-env" (list $name "app") | nindent 12 }}
            {{- include "cabinet.secret" (list $root "DB_PASSWORD" (printf "%s_DB_PASSWORD" (upper $name))) | nindent 12 }}
            {{- end }}
            {{- if ne $name "engagement" }}
            {{- include "cabinet.secret" (list $root "SIM_API_KEY" "SIM_API_KEY") | nindent 12 }}
            {{- end }}
            {{- if eq $name "engagement" }}
            - {name: SERVER_SHUTDOWN, value: graceful}
            - {name: SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE, value: "130s"}
            {{- end }}
            {{- if eq $name "identity" }}
            - {name: DEMO_ACCOUNTS, value: {{ $root.Values.app.demoAccounts | quote }}}
            - {name: REGISTRY_URL, value: "http://external-sim:8080"}
            - {name: ENGAGEMENT_URL, value: "http://engagement:8080"}
            {{- include "cabinet.secret" (list $root "IDENTITY_LINK_KEY" "IDENTITY_LINK_KEY") | nindent 12 }}
            {{- else if eq $name "credit" }}
            {{- if $documents }}
            {{- include "cabinet.documents.creditEnv" $root | nindent 12 }}
            {{- end }}
            {{- if $catalog }}
            - {name: CABINET_CATALOG_MODE, value: {{ $root.Values.catalog.creditMode | quote }}}
            - {name: CABINET_CATALOG_GRPC_CLIENT_HOST, value: catalog-grpc}
            - {name: CABINET_CATALOG_GRPC_CLIENT_PORT, value: "9094"}
            - {name: CABINET_CATALOG_GRPC_CLIENT_CERTIFICATE, value: /run/catalog-tls/tls.crt}
            - {name: CABINET_CATALOG_GRPC_CLIENT_KEY, value: /run/catalog-tls/tls.key}
            - {name: CABINET_CATALOG_GRPC_CLIENT_SERVER_CA, value: /run/catalog-tls/ca.crt}
            {{- end }}
            - {name: DEMO_ACCOUNTS, value: {{ $root.Values.app.demoAccounts | quote }}}
            - {name: STORAGE_BACKEND, value: s3}
            {{- $s3Endpoint := $root.Values.s3.endpoint }}
            {{- $s3Secret := $root.Values.secrets.existingSecret }}
            {{- if $root.Values.s3.internal.enabled }}
            {{- $s3Endpoint = "http://seaweedfs:8333" }}
            {{- $s3Secret = $root.Values.s3.internal.appSecret }}
            {{- end }}
            - {name: S3_ENDPOINT, value: {{ required "s3.endpoint is required in external S3 mode" $s3Endpoint | quote }}}
            - {name: S3_REGION, value: {{ $root.Values.s3.region | quote }}}
            - {name: S3_BUCKET, value: {{ $root.Values.s3.bucket | quote }}}
            - {name: DOCUMENT_UPLOADS_ENABLED, value: "true"}
            - {name: ANTIVIRUS_ENABLED, value: "true"}
            - {name: ANTIVIRUS_HOST, value: clamav}
            - {name: ANTIVIRUS_MAX_SIGNATURE_AGE, value: {{ $root.Values.antivirus.maxSignatureAge | quote }}}
            - {name: IDENTITY_URL, value: "http://identity:8080"}
            - {name: ENGAGEMENT_URL, value: "http://engagement:8080"}
            - {name: EXTERNAL_SIM_URL, value: "http://external-sim:8080"}
            {{- include "cabinet.secretFrom" (list $s3Secret "S3_ACCESS_KEY" "S3_ACCESS_KEY") | nindent 12 }}
            {{- include "cabinet.secretFrom" (list $s3Secret "S3_SECRET_KEY" "S3_SECRET_KEY") | nindent 12 }}
            {{- else if eq $name "engagement" }}
            - {name: IDENTITY_URL, value: "http://identity:8080"}
            - {name: CREDIT_URL, value: "http://credit:8080"}
            {{- if $bridge }}
            - {name: OLLAMA_URL, value: "http://127.0.0.1:11434"}
            - {name: ASSISTANT_MODEL, value: {{ required "ollamaBridge.model is required" $root.Values.ollamaBridge.model | quote }}}
            - {name: ASSISTANT_TIMEOUT, value: {{ $root.Values.ollamaBridge.timeout | quote }}}
            - {name: ASSISTANT_WARMUP, value: {{ $root.Values.ollamaBridge.warmup | quote }}}
            {{- else }}
            - {name: OLLAMA_URL, value: ""}
            - {name: ASSISTANT_WARMUP, value: "false"}
            {{- end }}
            {{- else }}
            - {name: SIM_CONTROL_ENABLED, value: {{ $root.Values.app.simControlEnabled | quote }}}
            {{- end }}
          {{- end }}
          {{- if eq $name "swagger-ui" }}
          env:
            - {name: BASE_URL, value: /swagger}
            - name: URLS
              value: '[{"url":"/v3/api-docs/identity","name":"identity"},{"url":"/v3/api-docs/credit","name":"credit"},{"url":"/v3/api-docs/engagement","name":"engagement"},{"url":"/v3/api-docs/external-sim","name":"external-sim"}]'
          {{- end }}
          {{- if or $catalog $documents $mcp }}
          volumeMounts:
            {{- if $mcp }}
            - {name: mcp-credit-tls, mountPath: /run/mcp-credit-tls, readOnly: true}
            {{- end }}
            {{- if $catalog }}
            - {name: catalog-credit-tls, mountPath: /run/catalog-tls, readOnly: true}
            {{- end }}
            {{- if $documents }}
            {{- include "cabinet.documents.creditMounts" $root | nindent 12 }}
            {{- end }}
      volumes:
        {{- if $mcp }}
        - name: mcp-credit-tls
          secret:
            secretName: {{ required "agentMcpCredit.tlsSecret is required" $root.Values.agentMcpCredit.tlsSecret | quote }}
            defaultMode: 0444
        {{- end }}
        {{- if $catalog }}
        - name: catalog-credit-tls
          secret:
            secretName: {{ required "catalog.creditTLSSecret is required" $root.Values.catalog.creditTLSSecret | quote }}
            defaultMode: 0444
        {{- end }}
        {{- if $documents }}
        {{- include "cabinet.documents.creditVolumes" $root | nindent 8 }}
        {{- end }}
          {{- end }}
          {{- if eq $name "gateway" }}
          volumeMounts:
            - {name: gateway-config, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf, readOnly: true}
            - {name: gateway-config, mountPath: /etc/nginx/cabinet-gateway, readOnly: true}
      volumes:
        - name: gateway-config
          configMap: {name: cabinet-gateway}
          {{- end }}
          {{- if $bridge }}
        {{- include "cabinet.ollamaBridge.container" $root | nindent 8 }}
      volumes:
        {{- include "cabinet.ollamaBridge.volumes" $root | nindent 8 }}
          {{- end }}
{{- if gt $replicas 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "cabinet.selector" (list $root $name) | nindent 6 }}
{{- end }}
{{- end }}
{{- end }}
