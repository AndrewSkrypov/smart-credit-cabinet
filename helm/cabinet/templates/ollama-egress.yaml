{{- if and .Values.app.enabled .Values.ollamaBridge.enabled }}
{{- if ne .Release.Namespace "cabinet-prod" }}
{{- fail "the Ollama SSH bridge can only run in cabinet-prod" }}
{{- end }}
{{- $bridge := .Values.ollamaBridge }}
{{- $host := required "ollamaBridge.host must be the verified SSH IPv4 address" $bridge.host }}
{{- $dns := required "ollamaBridge.dns.address or gateway.dnsResolver is required" ($bridge.dns.address | default .Values.gateway.dnsResolver) }}
{{- $ipv4 := "^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])[.]){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$" }}
{{- if or (not (regexMatch $ipv4 $host)) (not (regexMatch $ipv4 $dns)) (hasPrefix "127." $host) (eq "0.0.0.0" $host) }}
{{- fail "the Ollama target and DNS resolver must be IPv4 addresses, and SSH must target a remote host" }}
{{- end }}
{{- $port := int $bridge.port }}
{{- if or (not (regexMatch "^[1-9][0-9]{0,4}$" (toString $bridge.port))) (gt $port 65535) }}
{{- fail "ollamaBridge.port must be a valid TCP port" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cabinet-engagement-egress
spec:
  podSelector:
    matchLabels:
      {{- include "cabinet.selector" (list . "engagement") | nindent 6 }}
  policyTypes: [Egress]
  egress:
    - ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
      to:
        - ipBlock: {cidr: {{ printf "%s/32" $dns | quote }}}
        {{- with $bridge.dns.podLabels }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ required "ollamaBridge.dns.namespace is required for DNS pod peers" $bridge.dns.namespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
        {{- end }}
    {{- $root := . }}
    {{- range $backend, $port := dict "postgres" 5432 "valkey" 6379 "identity" 8080 "credit" 8080 }}
    - ports: [{protocol: TCP, port: {{ $port }}}]
      to:
        - podSelector:
            matchLabels:
              {{- include "cabinet.selector" (list $root $backend) | nindent 14 }}
    {{- end }}
    {{- if .Values.app.otlpEndpoint }}
    {{- $otlp := $bridge.otlp }}
    {{- if not $otlp.podLabels }}
    {{- fail "ollamaBridge.otlp.podLabels is required when OTLP tracing is enabled" }}
    {{- end }}
    - ports: [{protocol: TCP, port: {{ int $otlp.port }}}]
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ required "ollamaBridge.otlp.namespace is required when OTLP tracing is enabled" $otlp.namespace | quote }}
          podSelector:
            matchLabels:
              {{- toYaml $otlp.podLabels | nindent 14 }}
    {{- end }}
    - ports: [{protocol: TCP, port: {{ $port }}}]
      to:
        - ipBlock: {cidr: {{ printf "%s/32" $host | quote }}}
{{- end }}
