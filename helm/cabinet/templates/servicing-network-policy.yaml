{{- if (.Values.servicing | default dict).enabled }}
{{- $root := . }}
{{- $rules := list (list "servicing" "credit" 9095) (list "servicing-db" "servicing" 5432) (list "identity" "servicing" 8080) (list "valkey" "servicing" 6379) }}
{{- range $rule := $rules }}
{{- $target := index $rule 0 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cabinet-servicing-allow-{{ $target }}
spec:
  podSelector:
    matchLabels:
      {{- include "cabinet.selector" (list $root $target) | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {protocol: TCP, port: {{ index $rule 2 }}}
      from:
        - podSelector:
            matchLabels:
              {{- include "cabinet.selector" (list $root (index $rule 1)) | nindent 14 }}
{{- end }}
{{- end }}
