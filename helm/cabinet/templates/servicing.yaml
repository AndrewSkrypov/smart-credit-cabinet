{{- $settings := .Values.servicing | default dict }}
{{- if $settings.enabled }}
{{- if or (not .Values.app.enabled) (ne .Release.Namespace "cabinet-dev") (ne ($settings.devMode | default "") "local") }}
{{- fail "Servicing Helm candidate requires the cabinet-dev namespace, app.enabled and servicing.devMode=local" }}
{{- end }}
{{- $revision := .Values.release.revision }}
{{- $jar := $settings.jarSha256 | default "" }}
{{- if not (and (regexMatch "^[a-f0-9]{40}$" $revision) (regexMatch "^[a-f0-9]{64}$" $jar)) }}
{{- fail "Servicing requires the protected release revision and JAR SHA-256" }}
{{- end }}
{{- $image := include "cabinet.image" (list . "servicing") }}
{{- $postgres := include "cabinet.image" (list . "postgres") }}
{{- $dbSecret := required "servicing.databaseSecret is required" $settings.databaseSecret }}
{{- $tlsSecret := required "servicing.serverTlsSecret is required" $settings.serverTlsSecret }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: servicing-postgres-init
data:
  init.sql: |-
    {{- .Files.Get "files/servicing/init.sql" | trimSuffix "\n" | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: servicing-db
spec:
  type: ClusterIP
  selector:
    {{- include "cabinet.selector" (list . "servicing-db") | nindent 4 }}
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: servicing-db
spec:
  serviceName: servicing-db
  replicas: 1
  selector:
    matchLabels:
      {{- include "cabinet.selector" (list . "servicing-db") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cabinet.selector" (list . "servicing-db") | nindent 8 }}
    spec:
      {{- include "cabinet.pod" . | nindent 6 }}
      containers:
        - name: postgres
          image: {{ $postgres | quote }}
          args: [postgres, -c, shared_buffers=64MB, -c, max_connections=30]
          env:
            - {name: POSTGRES_DB, value: postgres}
            - {name: POSTGRES_USER, value: postgres}
            - {name: POSTGRES_INITDB_ARGS, value: "--auth-host=scram-sha-256"}
            {{- include "cabinet.secretFrom" (list $dbSecret "POSTGRES_PASSWORD" "POSTGRES_PASSWORD") | nindent 12 }}
            {{- include "cabinet.secretFrom" (list $dbSecret "CABINET_SERVICING_PG_OWNER_PASSWORD" "OWNER_PASSWORD") | nindent 12 }}
            {{- include "cabinet.secretFrom" (list $dbSecret "CABINET_SERVICING_PG_APP_PASSWORD" "APP_PASSWORD") | nindent 12 }}
          ports:
            - {name: postgres, containerPort: 5432}
          startupProbe:
            exec:
              command: [/bin/sh, -ec, 'PGPASSWORD="$CABINET_SERVICING_PG_APP_PASSWORD" psql -X -w -h 127.0.0.1 -U servicing_app -d servicing -c "SELECT 1" >/dev/null']
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command: [/bin/sh, -ec, 'PGPASSWORD="$CABINET_SERVICING_PG_APP_PASSWORD" psql -X -w -h 127.0.0.1 -U servicing_app -d servicing -c "SELECT 1" >/dev/null']
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: "1", memory: 384Mi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
      volumes:
        - name: init
          configMap: {name: servicing-postgres-init}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        {{- include "cabinet.storageClass" . | nindent 8 }}
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ required "servicing.storage is required" $settings.storage | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: servicing
spec:
  type: ClusterIP
  selector:
    {{- include "cabinet.selector" (list . "servicing") | nindent 4 }}
  ports:
    - {name: grpc, port: 9095, targetPort: grpc}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: servicing
  annotations:
    cabinet.release/revision: {{ $revision | quote }}
    cabinet.release/jar-sha256: {{ $jar | quote }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      {{- include "cabinet.selector" (list . "servicing") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cabinet.selector" (list . "servicing") | nindent 8 }}
      annotations:
        cabinet.release/revision: {{ $revision | quote }}
        cabinet.release/jar-sha256: {{ $jar | quote }}
    spec:
      {{- include "cabinet.pod" . | nindent 6 }}
      terminationGracePeriodSeconds: 150
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      initContainers:
        - name: servicing-flyway
          image: {{ $image | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          env:
            - {name: MIGRATION_ONLY, value: "true"}
            - {name: DB_HOST, value: servicing-db}
            - {name: DB_PORT, value: "5432"}
            - {name: DB_NAME, value: servicing}
            - {name: DB_USER, value: servicing_owner}
            {{- include "cabinet.secretFrom" (list $dbSecret "DB_PASSWORD" "OWNER_PASSWORD") | nindent 12 }}
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: "1", memory: 384Mi}
        - name: confirm-fenced
          image: {{ $postgres | quote }}
          command: [/bin/sh, -ec]
          args:
            - |
              test "$(psql -XAtqw -v ON_ERROR_STOP=1 -c 'select writer from public.servicing_writer_fence where singleton')" = FENCED
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          env:
            - {name: PGHOST, value: servicing-db}
            - {name: PGDATABASE, value: servicing}
            - {name: PGUSER, value: servicing_app}
            {{- include "cabinet.secretFrom" (list $dbSecret "PGPASSWORD" "APP_PASSWORD") | nindent 12 }}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 250m, memory: 96Mi}
      containers:
        - name: servicing
          image: {{ $image | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          env:
            - {name: SPRING_PROFILES_ACTIVE, value: prod}
            - {name: SPRING_FLYWAY_ENABLED, value: "false"}
            - {name: DB_HOST, value: servicing-db}
            - {name: DB_PORT, value: "5432"}
            - {name: DB_NAME, value: servicing}
            - {name: DB_USER, value: servicing_app}
            {{- include "cabinet.secretFrom" (list $dbSecret "DB_PASSWORD" "APP_PASSWORD") | nindent 12 }}
            {{- include "cabinet.secret" (list . "JWT_SECRET" "JWT_SECRET") | nindent 12 }}
            - {name: CABINET_VALKEY_ENABLED, value: "true"}
            - {name: CABINET_VALKEY_HOST, value: valkey}
            {{- include "cabinet.secret" (list . "CABINET_VALKEY_PASSWORD" "VALKEY_PASSWORD") | nindent 12 }}
            - {name: IDENTITY_URL, value: "http://identity:8080"}
            - {name: SERVER_SHUTDOWN, value: graceful}
            - {name: SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE, value: "125s"}
            - {name: SERVICING_GRPC_HOST, value: "0.0.0.0"}
            - {name: SERVICING_GRPC_PORT, value: "9095"}
            - {name: SERVICING_SERVER_CERTIFICATE, value: /run/servicing-tls/tls.crt}
            - {name: SERVICING_SERVER_KEY, value: /run/servicing-tls/tls.key}
            - {name: SERVICING_CLIENT_CA, value: /run/servicing-tls/ca.crt}
            - {name: SERVICING_CLIENT_URI, value: "spiffe://creditcabinet/credit"}
          ports:
            - {name: grpc, containerPort: 9095}
            - {name: health, containerPort: 8095}
          startupProbe:
            httpGet: {path: /actuator/health, port: health}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /actuator/health, port: health}
          livenessProbe:
            tcpSocket: {port: health}
          resources:
            {{- toYaml $settings.resources | nindent 12 }}
          volumeMounts:
            - {name: server-tls, mountPath: /run/servicing-tls, readOnly: true}
      volumes:
        - name: server-tls
          secret:
            secretName: {{ $tlsSecret | quote }}
            defaultMode: 0440
            items:
              - {key: tls.crt, path: tls.crt}
              - {key: tls.key, path: tls.key}
              - {key: ca.crt, path: ca.crt}
{{- end }}
