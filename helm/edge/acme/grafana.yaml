apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: grafana-letsencrypt
  namespace: monitoring
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: grafana-letsencrypt-account
    solvers:
      - http01:
          ingress:
            ingressClassName: cabinet-public
            ingressTemplate:
              metadata:
                annotations:
                  traefik.ingress.kubernetes.io/router.entrypoints: web
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: grafana-prod
  namespace: monitoring
spec:
  secretName: grafana-prod-tls
  issuerRef:
    name: grafana-letsencrypt
    kind: Issuer
  dnsNames:
    - grafana.credit-cabinet.ru
