apiVersion: v1
kind: ConfigMap
metadata:
  name: cabinet-www-redirect
  namespace: cabinet-prod
data:
  nginx.conf: |
    pid /tmp/nginx.pid;
    events {}
    http {
      access_log off;
      client_body_temp_path /tmp/client_body;
      proxy_temp_path /tmp/proxy;
      fastcgi_temp_path /tmp/fastcgi;
      uwsgi_temp_path /tmp/uwsgi;
      scgi_temp_path /tmp/scgi;
      server {
        listen 8080;
        return 308 https://credit-cabinet.ru$request_uri;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cabinet-www-redirect
  namespace: cabinet-prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: cabinet-www-redirect
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cabinet-www-redirect
    spec:
      automountServiceAccountToken: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: cabinet-www-redirect
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
          command: [nginx, -c, /config/nginx.conf, -g, "daemon off;"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: runtime
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: cabinet-www-redirect
        - name: runtime
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: cabinet-www-redirect
  namespace: cabinet-prod
spec:
  selector:
    app.kubernetes.io/name: cabinet-www-redirect
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cabinet-www-redirect
  namespace: cabinet-prod
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: cabinet-public
  tls:
    - hosts: [www.credit-cabinet.ru]
      secretName: cabinet-prod-tls
  rules:
    - host: www.credit-cabinet.ru
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cabinet-www-redirect
                port:
                  name: http
