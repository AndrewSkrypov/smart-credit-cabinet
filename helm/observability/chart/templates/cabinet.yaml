apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cabinet-services
spec:
  namespaceSelector:
    matchNames: [{{ .Values.global.cabinetAppNamespace | quote }}]
  selector: {}
  sampleLimit: 10000
  endpoints:
    - port: {{ .Values.cabinet.scrapePort | quote }}
      path: /actuator/prometheus
      interval: 15s
      scrapeTimeout: 5s
      relabelings:
        - sourceLabels: [__meta_kubernetes_service_name]
          action: keep
          regex: {{ join "|" .Values.cabinet.scrapeServices | quote }}
        - sourceLabels: [__meta_kubernetes_service_name]
          targetLabel: service
        - targetLabel: environment
          replacement: {{ .Values.global.cabinetEnvironment | quote }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cabinet-alerts
spec:
  groups:
    {{- $groups := list }}
    {{- range $path, $_ := .Files.Glob "files/rules/*.yaml" }}
    {{- $groups = concat $groups (fromYaml ($.Files.Get $path)).groups }}
    {{- end }}
    {{- $runbook := "https://github.com/AndrewSkrypov/smart-credit-cabinet/blob/HEAD/docs/operations.md" }}
    {{- $groups | toYaml | replace $runbook (default $runbook .Values.cabinet.runbookBaseUrl) | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cabinet-datasources
  labels:
    grafana_datasource: "1"
data:
  cabinet.yaml: |
    {{- required "run helm/observability/prepare.sh to stage Grafana datasource config" (.Files.Get "files/datasources.yaml") | replace "http://prometheus:9090" "http://cabinet-metrics-prometheus:9090" | nindent 4 }}
{{- range $path, $data := .Files.Glob "files/dashboards/*.json" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cabinet-dashboard-{{ base $path | trimSuffix ".json" }}
  labels:
    grafana_dashboard: "1"
data:
  {{ base $path }}: |
    {{- $data | toString | nindent 4 }}
{{- end }}
