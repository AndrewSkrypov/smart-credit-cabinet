apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cabinet-tempo-ingress
spec:
  podSelector:
    matchLabels:
      cabinet-observability: tempo
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.global.cabinetAppNamespace | quote }}
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: {{ toJson .Values.cabinet.scrapeServices }}
      ports: [{protocol: TCP, port: 4318}]
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports: [{protocol: TCP, port: 3200}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cabinet-loki-ingress
spec:
  podSelector:
    matchLabels:
      cabinet-observability: loki
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
              app.kubernetes.io/instance: {{ .Release.Name }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vector
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports: [{protocol: TCP, port: 3100}]
