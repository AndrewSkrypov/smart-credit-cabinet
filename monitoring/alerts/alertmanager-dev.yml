route:
  receiver: discard
  group_by: [environment, alertname, service]
  group_wait: 15s
  group_interval: 1m
  repeat_interval: 24h
  routes:
    - receiver: telegram-smoke
      matchers: ['environment="dev"', 'alertname="CabinetTelegramSmoke"', 'severity="info"', 'service="monitoring"']

receivers:
  - name: discard
  - name: telegram-smoke
    telegram_configs:
      - api_url: https://api.telegram.org
        bot_token_file: /etc/alertmanager/secrets/cabinet-paging/telegram-token
        chat_id_file: /etc/alertmanager/secrets/cabinet-paging/telegram-chat-id
        parse_mode: ""
        send_resolved: true
        http_config:
          tls_config:
            insecure_skip_verify: false
        message: '[PUMP TEST][{{ .Status | toUpper }}][dev][info] CabinetTelegramSmoke monitoring'
