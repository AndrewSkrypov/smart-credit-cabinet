apiVersion: 1
datasources:
  - name: Prometheus
    uid: cabinet-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: cabinet-tempo
  - name: Tempo
    uid: cabinet-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: cabinet-loki
        spanStartTimeShift: '-5m'
        spanEndTimeShift: '5m'
        tags:
          - key: service.name
            value: service
        customQuery: true
        query: '{$${__tags}} | json | traceId="$${__trace.traceId}"'
  - name: Loki
    uid: cabinet-loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      derivedFields:
        - name: TraceID
          matcherRegex: '"traceId"\s*:\s*"([a-f0-9]+)"'
          datasourceUid: cabinet-tempo
          url: '$${__value.raw}'
