global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: credit
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: [credit]
        type: A
        port: 8080
        refresh_interval: 15s
    relabel_configs:
      - target_label: service
        replacement: credit
  - job_name: cabinet
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [identity:8080, engagement:8080, external-sim:8080]
    relabel_configs:
      - source_labels: [__address__]
        regex: '([^:]+):.*'
        target_label: service
        replacement: '$1'
