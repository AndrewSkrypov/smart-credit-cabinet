services:
  credit:
    environment:
      INFO_REQUEST_TTL: ${DEMO_HISTORY_TTL:-PT30M}
      OFFER_TTL: ${DEMO_HISTORY_TTL:-PT30M}
  gateway:
    ports: !override
      - "127.0.0.1:${GATEWAY_PORT:-18082}:80"
  clamav:
    image: "${CABINET_CI_CLAMAV_IMAGE:-clamav/clamav:1.5.5@sha256:64e30c0bf976198024deb3dc6d5cfe2485fb969c0f73549ba0fdb364b9469614}"
