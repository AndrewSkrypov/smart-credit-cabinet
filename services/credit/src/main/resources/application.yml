server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: credit
  jackson:
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:credit}
    username: ${DB_USER:cabinet}
    password: ${DB_PASSWORD:cabinet}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB

springdoc:
  api-docs:
    path: /v3/api-docs/credit
  swagger-ui:
    path: /swagger-ui.html

cabinet:
  outbox:
    enabled: true
    worker-enabled: ${OUTBOX_WORKER_ENABLED:true}
  # The product line, the needs wizard and the calculator are public: the landing page shows
  # them before sign-in, and they carry no personal data. Everything else requires a token.
  security:
    public-endpoints:
      - "GET /api/v1/products"
      - "GET /api/v1/products/purposes"
      - "GET /api/v1/products/*"
      - "GET /api/v1/products/*/calculation"
      - "POST /api/v1/products/match"
  # identity inside the network: tokens revoked by a password change or a block are refused.
  # Empty = only signature and expiry are checked.
  identity:
    url: ${IDENTITY_URL:}
  # An unavailable destination leaves notifications in the durable outbox.
  engagement:
    url: ${ENGAGEMENT_URL:}
  openapi:
    title: "Кабинет предпринимателя: заявки, кредитный конвейер и решения"
  auth:
    jwt-secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-32bytes+}
  storage:
    mode: ${STORAGE_BACKEND:local}
    uploads-enabled: ${DOCUMENT_UPLOADS_ENABLED:true}
    # Documents of applications: a docker volume mounted at /app/uploads under compose.
    local-dir: ${UPLOAD_DIR:./uploads}
    max-size-bytes: ${UPLOAD_MAX_SIZE_BYTES:20971520}
    s3:
      endpoint: ${S3_ENDPOINT:http://seaweedfs:8333}
      region: ${S3_REGION:us-east-1}
      bucket: ${S3_BUCKET:cabinet-documents}
      access-key: ${S3_ACCESS_KEY:dev-cabinet-storage}
      secret-key: ${S3_SECRET_KEY:dev-storage-secret-change-me}
  antivirus:
    enabled: ${ANTIVIRUS_ENABLED:true}
    host: ${ANTIVIRUS_HOST:localhost}
    port: ${ANTIVIRUS_PORT:3310}
    timeout: ${ANTIVIRUS_TIMEOUT:PT10S}
    max-signature-age: ${ANTIVIRUS_MAX_SIGNATURE_AGE:PT72H}
  # External systems (the external-sim service locally): registries, tax service, bureau, bank
  # data, signing, core banking.
  external:
    url: ${EXTERNAL_SIM_URL:}
    api-key: ${SIM_API_KEY:dev-sim-api-key}
    read-timeout: ${EXTERNAL_READ_TIMEOUT:PT5S}
  # Timings of the pipeline; production values by default (docs/process-model.md, section 8).
  pipeline:
    enabled: ${PIPELINE_ENABLED:true}
    info-request-ttl: ${INFO_REQUEST_TTL:P14D}
    offer-ttl: ${OFFER_TTL:P5D}
    source-timeout: ${SOURCE_TIMEOUT:PT1H}
