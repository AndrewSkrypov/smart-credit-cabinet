# Spring keeps several test contexts alive in one JVM; a background worker in any of them would take
# the jobs of another test's applications. Tests that need the pipeline run due jobs themselves.
cabinet.pipeline.enabled=false
# Process tests use synthetic files; real INSTREAM and infected-file checks have their own context.
cabinet.antivirus.enabled=false

# Idle cached test contexts should not fill the disposable PostgreSQL server.
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=5
