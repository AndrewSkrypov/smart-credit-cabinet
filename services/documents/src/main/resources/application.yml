spring:
  application:
    name: documents
  jackson:
    serialization:
      write-dates-as-timestamps: false
  main:
    web-application-type: none
  datasource:
    url: ${DOCUMENTS_DATABASE_URL:jdbc:postgresql://localhost:5432/documents}
    username: ${DOCUMENTS_DATABASE_USER:documents_app}
    password: ${DOCUMENTS_DATABASE_PASSWORD}
  flyway:
    enabled: true
cabinet:
  documents:
    grpc:
      port: ${DOCUMENTS_GRPC_PORT:9096}
      certificate: ${DOCUMENTS_TLS_CERTIFICATE}
      key: ${DOCUMENTS_TLS_KEY}
      ca: ${DOCUMENTS_TLS_CA}
      credit-peer: ${DOCUMENTS_CREDIT_PEER:spiffe://credit-cabinet/credit}
