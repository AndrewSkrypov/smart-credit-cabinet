server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: engagement
  jackson:
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:engagement}
    username: ${DB_USER:cabinet}
    password: ${DB_PASSWORD:cabinet}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

springdoc:
  api-docs:
    path: /v3/api-docs/engagement
  swagger-ui:
    path: /swagger-ui.html

cabinet:
  # identity inside the network: tokens revoked by a password change or a block are refused.
  # Empty = only signature and expiry are checked.
  identity:
    url: ${IDENTITY_URL:}
  # The assistant reads applications from credit with the caller's token.
  credit:
    url: ${CREDIT_URL:}
  assistant:
    # Ollama with a model of open weights (docker compose --profile ai). Empty or not running:
    # the assistant answers by rules from the same reference and application facts.
    ollama-url: ${OLLAMA_URL:}
    model: ${ASSISTANT_MODEL:qwen2.5:1.5b}
    answer-timeout: ${ASSISTANT_TIMEOUT:PT90S}
  openapi:
    title: "Кабинет предпринимателя: уведомления и помощник"
  auth:
    jwt-secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-32bytes+}
