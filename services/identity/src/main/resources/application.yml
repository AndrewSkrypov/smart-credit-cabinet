server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: identity
  jackson:
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:identity}
    username: ${DB_USER:cabinet}
    password: ${DB_PASSWORD:cabinet}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
    placeholders:
      # "false" blocks the seeded demo accounts, whose password is published in the README.
      demo-accounts: ${DEMO_ACCOUNTS:true}

springdoc:
  api-docs:
    path: /v3/api-docs/identity
  swagger-ui:
    path: /swagger-ui.html

cabinet:
  outbox:
    enabled: true
    worker-enabled: ${OUTBOX_WORKER_ENABLED:true}
  engagement:
    url: ${ENGAGEMENT_URL:}
  # Served without a signed-in user; everything else requires a valid token.
  security:
    public-endpoints:
      - "POST /api/v1/auth/sign-in"
      - "POST /api/v1/auth/sign-up"
      - "GET /api/v1/auth/options"
      - "POST /api/v1/auth/password-recovery"
      - "POST /api/v1/auth/password-reset"
      - "POST /api/v1/auth/invitations/inspect"
      - "POST /api/v1/auth/invitations/accept"
  openapi:
    title: "Кабинет предпринимателя: пользователи, компании и вход"
  # ЕГРЮЛ/ЕГРИП: the company name at sign-up. Empty = sign-up without the registry.
  registry:
    url: ${REGISTRY_URL:}
    api-key: ${SIM_API_KEY:dev-sim-api-key}
  auth:
    link-key: ${IDENTITY_LINK_KEY:dev-identity-links-change-before-deployment-48bytes}
    link-key-version: ${IDENTITY_LINK_KEY_VERSION:1}
    jwt-secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-32bytes+}
    jwt-ttl-hours: ${JWT_TTL_HOURS:12}
