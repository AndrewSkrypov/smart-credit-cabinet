server:
  port: ${SERVER_PORT:8095}
spring:
  application:
    name: servicing
  jackson:
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:servicing}
    username: ${DB_USER:servicing_app}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:false}
cabinet:
  database:
    guard-enabled: true
  identity:
    url: ${IDENTITY_URL:}
  auth:
    jwt-secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-32bytes+}
  servicing:
    grpc:
      host: ${SERVICING_GRPC_HOST:127.0.0.1}
      port: ${SERVICING_GRPC_PORT:9095}
      certificate: ${SERVICING_SERVER_CERTIFICATE:}
      key: ${SERVICING_SERVER_KEY:}
      client-ca: ${SERVICING_CLIENT_CA:}
      client-uri: ${SERVICING_CLIENT_URI:spiffe://creditcabinet/credit}
management:
  otlp:
    tracing:
      export:
        enabled: false
